<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width,initial-scale=1,
               viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>A.L.E.X</title>

<style>

:root {
    --bg: #020606;
    --panel: #061010;
    --panel2: #091818;
    --green: #39ff14;
    --cyan: #19d9ff;
    --darkgreen: #0d5515;
    --dim: #4c9b59;
    --white: #d8ffdf;
    --danger: #ff4545;
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;

    background: var(--bg);
    color: var(--white);

    font-family:
        "Courier New",
        monospace;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

#app {
    position: relative;
    width: 100vw;
    height: 100vh;
    overflow: hidden;
}

/* =========================================================
   HOME
   ========================================================= */

#home {
    position: absolute;
    inset: 0;

    display: flex;
    flex-direction: column;

    background:
        radial-gradient(
            circle at center,
            rgba(20,70,45,.08),
            transparent 48%
        ),
        var(--bg);
}

/* HEADER */

.header {
    height: 58px;
    min-height: 58px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-bottom:
        1px solid rgba(57,255,20,.13);

    position: relative;
}

.logo {
    color: var(--green);

    font-size: 22px;
    font-weight: bold;

    letter-spacing: 5px;

    text-shadow:
        0 0 8px rgba(57,255,20,.8),
        0 0 22px rgba(57,255,20,.25);
}

.status {
    position: absolute;

    right: 15px;
    top: 22px;

    font-size: 9px;
    letter-spacing: 2px;

    color: var(--dim);
}

.status.active {
    color: var(--green);

    text-shadow:
        0 0 8px rgba(57,255,20,.5);
}

/* =========================================================
   WAVE
   ========================================================= */

.wave-area {
    position: relative;

    flex: 1;

    min-height: 0;

    display: flex;
    align-items: center;
    justify-content: center;

    padding-bottom: 135px;
}

#wave {
    width: 94%;
    max-width: 850px;
    height: 230px;
}

.core {
    position: absolute;

    width: 6px;
    height: 6px;

    border-radius: 50%;

    background: var(--cyan);

    box-shadow:
        0 0 10px var(--cyan),
        0 0 25px rgba(25,217,255,.65);
}

/* =========================================================
   CHAT
   ========================================================= */

.chat-panel {
    position: absolute;

    left: 14px;
    right: 14px;
    bottom: 110px;

    height: 85px;

    max-width: 700px;

    margin: auto;

    padding: 9px 11px;

    overflow-y: auto;

    background:
        rgba(2,12,12,.9);

    border:
        1px solid rgba(57,255,20,.23);

    box-shadow:
        inset 0 0 18px rgba(0,0,0,.45);
}

.chat-line {
    margin-bottom: 7px;

    font-size: 10px;

    line-height: 1.35;
}

.user {
    color: var(--cyan);
}

.alex {
    color: var(--green);
}

/* =========================================================
   CONTROLS
   ========================================================= */

.controls {
    position: absolute;

    left: 12px;
    right: 12px;
    bottom: 10px;

    height: 91px;

    display: flex;
    flex-direction: column;

    gap: 7px;
}

.input-row {
    width: 100%;

    display: flex;

    gap: 7px;
}

#textInput {
    flex: 1;

    min-width: 0;

    height: 39px;

    padding:
        0 12px;

    background: #030909;

    border:
        1px solid rgba(57,255,20,.32);

    outline: none;

    color: var(--green);

    font-size: 11px;
}

#textInput:focus {
    border-color: var(--green);

    box-shadow:
        0 0 10px rgba(57,255,20,.12);
}

.control-row {
    display: flex;

    justify-content: center;

    gap: 7px;
}

.alex-button {
    height: 34px;

    padding:
        0 15px;

    background:
        rgba(5,18,14,.95);

    border:
        1px solid rgba(57,255,20,.35);

    color: var(--green);

    font-size: 9px;

    letter-spacing: 1px;

    white-space: nowrap;

    transition:
        .15s ease;
}

.alex-button:hover {
    border-color: var(--green);

    box-shadow:
        0 0 12px rgba(57,255,20,.16);
}

.alex-button:active {
    transform: scale(.97);
}

.mic-button {
    color: var(--cyan);

    border-color:
        rgba(25,217,255,.4);
}

.mic-button.listening {
    color: white;

    background:
        rgba(25,217,255,.12);

    border-color:
        var(--cyan);

    box-shadow:
        0 0 16px rgba(25,217,255,.3);
}

/* =========================================================
   GENERAL SCREENS
   ========================================================= */

.screen {
    position: absolute;
    inset: 0;

    display: none;

    background: var(--bg);
}

.screen.active {
    display: block;
}

/* =========================================================
   ARCHIVE
   LANDSCAPE DATABASE
   ========================================================= */

#archiveScreen {
    overflow: hidden;
}

.archive-layout {
    width: 100%;
    height: 100%;

    display: grid;

    grid-template-columns:
        minmax(250px, 36%)
        minmax(0, 64%);
}

/* LEFT */

.archive-list {
    min-width: 0;

    padding:
        22px 18px 82px;

    overflow-y: auto;

    border-right:
        1px solid rgba(57,255,20,.2);

    background:
        rgba(3,12,12,.45);
}

.archive-title {
    color: var(--green);

    font-size: 15px;

    letter-spacing: 3px;
}

.archive-subtitle {
    margin-top: 7px;
    margin-bottom: 18px;

    color: var(--dim);

    font-size: 8px;

    letter-spacing: 1px;
}

#suitList {
    display: flex;
    flex-direction: column;

    gap: 8px;
}

.suit-card {
    width: 100%;

    min-height: 82px;

    display: flex;

    gap: 11px;

    align-items: center;

    padding: 9px;

    background:
        rgba(5,17,17,.8);

    border:
        1px solid rgba(57,255,20,.17);

    transition:
        .15s ease;
}

.suit-card:hover {
    border-color:
        rgba(57,255,20,.6);
}

.suit-card.selected {
    border-color:
        var(--cyan);

    box-shadow:
        0 0 13px rgba(25,217,255,.1);
}

.suit-thumb {
    width: 52px;
    height: 64px;

    flex-shrink: 0;

    object-fit: cover;

    background: #010404;

    border:
        1px solid rgba(57,255,20,.18);
}

.suit-info {
    min-width: 0;
}

.suit-name {
    color: var(--green);

    font-size: 10px;

    margin-bottom: 5px;

    word-break: break-word;
}

.suit-era {
    color: var(--dim);

    font-size: 7px;

    letter-spacing: 1px;
}

/* EMPTY ARCHIVE */

.empty-archive {
    padding: 35px 15px;

    text-align: center;

    color: var(--dim);

    font-size: 9px;

    line-height: 1.7;

    border:
        1px dashed rgba(57,255,20,.15);
}

/* =========================================================
   ARCHIVE PREVIEW
   ========================================================= */

.archive-preview {
    position: relative;

    min-width: 0;

    display: flex;

    flex-direction: column;

    align-items: center;

    justify-content: center;

    padding:
        25px 25px 82px;
}

.preview-title {
    color: var(--cyan);

    font-size: 11px;

    letter-spacing: 2px;

    margin-bottom: 13px;
}

#selectedImage {
    max-width: 78%;
    max-height: 59%;

    object-fit: contain;

    background: #010404;

    border:
        1px solid rgba(57,255,20,.22);

    box-shadow:
        0 0 25px rgba(57,255,20,.07);
}

.preview-name {
    margin-top: 11px;

    color: var(--green);

    font-size: 13px;

    letter-spacing: 2px;

    text-align: center;
}

.preview-description {
    max-width: 600px;

    margin-top: 7px;

    color: #7fb588;

    font-size: 8px;

    line-height: 1.5;

    text-align: center;
}

/* =========================================================
   ARCHIVE BOTTOM BAR
   ========================================================= */

.archive-controls {
    position: absolute;

    left: 15px;
    right: 15px;
    bottom: 12px;

    height: 48px;

    display: flex;

    justify-content: center;
    align-items: center;

    gap: 7px;

    border-top:
        1px solid rgba(57,255,20,.12);

    padding-top: 8px;
}

.delete-button {
    color: var(--danger);

    border-color:
        rgba(255,69,69,.4);
}

.delete-button:hover {
    border-color:
        var(--danger);

    box-shadow:
        0 0 12px rgba(255,69,69,.15);
}

/* =========================================================
   SUIT VIEW
   PORTRAIT
   ========================================================= */

#suitScreen {
    overflow: hidden;
}

.suit-view {
    width: 100%;
    height: 100%;

    display: flex;

    flex-direction: column;
}

.suit-header {
    height: 57px;
    min-height: 57px;

    display: flex;

    align-items: center;
    justify-content: center;

    border-bottom:
        1px solid rgba(57,255,20,.13);
}

.suit-image-area {
    flex: 1;

    min-height: 0;

    display: flex;

    align-items: center;
    justify-content: center;

    padding: 18px;
}

#suitLargeImage {
    max-width: 92%;
    max-height: 72%;

    object-fit: contain;

    background: #010404;

    box-shadow:
        0 0 28px rgba(57,255,20,.08);
}

.suit-details {
    text-align: center;

    padding:
        4px 20px 83px;
}

#suitLargeName {
    color: var(--green);

    font-size: 14px;

    letter-spacing: 2px;
}

#suitLargeDescription {
    max-width: 600px;

    margin:
        7px auto 0;

    color: #7fb588;

    font-size: 8px;

    line-height: 1.5;
}

.suit-bottom {
    position: absolute;

    left: 10px;
    right: 10px;
    bottom: 10px;

    display: flex;

    justify-content: center;

    gap: 7px;
}

/* =========================================================
   TOAST
   ========================================================= */

#toast {
    position: fixed;

    left: 50%;
    bottom: 75px;

    transform:
        translate(-50%,20px);

    opacity: 0;

    pointer-events: none;

    z-index: 100;

    padding:
        9px 14px;

    background:
        #061010;

    border:
        1px solid var(--green);

    color: var(--green);

    font-size: 9px;

    transition:
        .25s ease;
}

#toast.show {
    opacity: 1;

    transform:
        translate(-50%,0);
}

/* =========================================================
   MOBILE LANDSCAPE ARCHIVE
   ========================================================= */

@media (max-height: 550px) {

    .archive-list {
        padding-top: 12px;
    }

    .archive-title {
        font-size: 12px;
    }

    .archive-subtitle {
        margin-bottom: 9px;
    }

    .suit-card {
        min-height: 58px;
    }

    .suit-thumb {
        width: 40px;
        height: 48px;
    }

    #selectedImage {
        max-height: 50%;
    }

}

/* =========================================================
   PORTRAIT HOME
   ========================================================= */

@media (orientation: portrait) {

    .wave-area {
        padding-bottom: 130px;
    }

    .chat-panel {
        bottom: 108px;
    }

    .controls {
        bottom: 8px;
    }

    .logo {
        font-size: 19px;
    }

}

/* =========================================================
   SMALL PHONES
   ========================================================= */

@media (max-width: 430px) {

    .alex-button {
        padding:
            0 10px;

        font-size: 8px;
    }

    .control-row {
        gap: 5px;
    }

    .chat-panel {
        left: 9px;
        right: 9px;
    }

}

</style>
</head>

<body>

<div id="app">

<!-- =======================================================
     HOME
     ======================================================= -->

<section id="home">

    <div class="header">

        <div class="logo">
            A.L.E.X
        </div>

        <div
            id="status"
            class="status"
        >
            STANDBY
        </div>

    </div>


    <div class="wave-area">

        <canvas id="wave"></canvas>

        <div class="core"></div>

    </div>


    <div
        id="chat"
        class="chat-panel"
    ></div>


    <div class="controls">

        <div class="input-row">

            <input
                id="textInput"
                type="text"
                autocomplete="off"
                placeholder="ENTER COMMAND..."
            >

            <button
                class="alex-button"
                onclick="sendText()"
            >
                SEND
            </button>

        </div>


        <div class="control-row">

            <button
                id="micButton"
                class="alex-button mic-button"
                onclick="toggleMic()"
            >
                MIC OFF
            </button>

            <button
                class="alex-button"
                onclick="openArchive()"
            >
                ARCHIVES
            </button>

            <button
                class="alex-button"
                onclick="speakLast()"
            >
                SPEAK
            </button>

        </div>

    </div>

</section>


<!-- =======================================================
     ARCHIVE
     ======================================================= -->

<section
    id="archiveScreen"
    class="screen"
>

    <div class="archive-layout">

        <div class="archive-list">

            <div class="archive-title">
                A.L.E.X // ARCHIVE
            </div>

            <div class="archive-subtitle">
                SUIT DATABASE // USER COLLECTION
            </div>

            <div id="suitList"></div>

        </div>


        <div class="archive-preview">

            <div class="preview-title">
                SELECTED SUIT
            </div>


            <img
                id="selectedImage"
                alt="Selected suit"
            >


            <div
                id="selectedName"
                class="preview-name"
            ></div>


            <div
                id="selectedDescription"
                class="preview-description"
            ></div>


            <div class="archive-controls">

                <button
                    class="alex-button"
                    onclick="previousSuit()"
                >
                    &lt; PREV
                </button>

                <button
                    class="alex-button"
                    onclick="openSelectedSuit()"
                >
                    OPEN
                </button>

                <button
                    class="alex-button"
                    onclick="nextSuit()"
                >
                    NEXT &gt;
                </button>

                <button
                    class="alex-button"
                    onclick="document.getElementById('suitFile').click()"
                >
                    + ADD SUIT
                </button>

                <button
                    class="alex-button delete-button"
                    onclick="deleteSelectedSuit()"
                >
                    DELETE
                </button>

                <button
                    class="alex-button"
                    onclick="closeArchive()"
                >
                    HOME
                </button>

            </div>

        </div>

    </div>


    <input
        id="suitFile"
        type="file"
        accept="image/*"
        multiple
        hidden
    >

</section>


<!-- =======================================================
     INDIVIDUAL SUIT VIEW
     ======================================================= -->

<section
    id="suitScreen"
    class="screen"
>

    <div class="suit-view">

        <div class="suit-header">

            <div class="logo">
                A.L.E.X // SUIT
            </div>

        </div>


        <div class="suit-image-area">

            <img
                id="suitLargeImage"
                alt="Suit"
            >

        </div>


        <div class="suit-details">

            <div
                id="suitLargeName"
            ></div>

            <div
                id="suitLargeDescription"
            ></div>

        </div>

    </div>


    <div class="suit-bottom">

        <button
            class="alex-button"
            onclick="previousSuitFromView()"
        >
            &lt;
        </button>

        <button
            class="alex-button"
            onclick="openArchive()"
        >
            ARCHIVE
        </button>

        <button
            class="alex-button"
            onclick="closeSuitView()"
        >
            HOME
        </button>

        <button
            class="alex-button"
            onclick="nextSuitFromView()"
        >
            &gt;
        </button>

    </div>

</section>


</div>


<div id="toast"></div>


<script>

/* =========================================================
   ELEMENTS
   ========================================================= */

const home =
    document.getElementById("home");

const archiveScreen =
    document.getElementById("archiveScreen");

const suitScreen =
    document.getElementById("suitScreen");

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("textInput");

const status =
    document.getElementById("status");

const micButton =
    document.getElementById("micButton");

const wave =
    document.getElementById("wave");

const ctx =
    wave.getContext("2d");


/* =========================================================
   ARCHIVE DATA
   IMPORTANT:
   STARTS EMPTY
   ========================================================= */

let suits = [];

let selectedIndex = -1;


/* =========================================================
   LOAD SAVED SUITS
   ========================================================= */

try {

    const saved =
        localStorage.getItem(
            "alex_suits_v3"
        );

    if (saved) {

        const parsed =
            JSON.parse(saved);

        if (Array.isArray(parsed)) {

            suits = parsed;

        }

    }

} catch (error) {

    console.log(
        "Archive load error:",
        error
    );

}


if (suits.length) {

    selectedIndex = 0;

}


/* =========================================================
   SAVE
   ========================================================= */

function saveSuits() {

    try {

        localStorage.setItem(
            "alex_suits_v3",
            JSON.stringify(suits)
        );

    } catch (error) {

        console.log(
            "Archive save error:",
            error
        );

        toast(
            "COULD NOT SAVE ARCHIVE"
        );

    }

}


/* =========================================================
   CHAT
   ========================================================= */

function addChat(
    speaker,
    text
) {

    const line =
        document.createElement(
            "div"
        );

    line.className =
        "chat-line " +
        (
            speaker === "USER"
                ? "user"
                : "alex"
        );

    const now =
        new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        );

    line.innerHTML =
        "<b>" +
        escapeHTML(speaker) +
        " // " +
        escapeHTML(now) +
        "</b><br>" +
        escapeHTML(text);

    chat.appendChild(line);

    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================================
   TEXT
   ========================================================= */

function sendText() {

    const text =
        input.value.trim();

    if (!text) {
        return;
    }

    input.value = "";

    addChat(
        "USER",
        text
    );

    processCommand(text);

}


input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            sendText();

        }

    }
);


/* =========================================================
   COMMANDS
   ========================================================= */

function processCommand(
    text
) {

    const low =
        text.toLowerCase();


    if (
        low.includes("archive") ||
        low.includes("archives")
    ) {

        openArchive();

        alex(
            "Opening the archive."
        );

        return;

    }


    if (
        low.includes("add suit")
    ) {

        document
            .getElementById("suitFile")
            .click();

        return;

    }


    if (
        low.includes("delete suit")
    ) {

        deleteSelectedSuit();

        return;

    }


    if (
        low.includes("next suit")
    ) {

        nextSuit();

        return;

    }


    if (
        low.includes("previous suit")
    )
    {

        previousSuit();

        return;

    }


    if (
        low.includes("close archive") ||
        low.includes("go home")
    ) {

        closeArchive();

        alex(
            "Returning home."
        );

        return;

    }


    if (
        low.includes("hello") ||
        low.includes("hi alex") ||
        low === "hi"
    ) {

        alex(
            "Good to hear from you. Systems are standing by."
        );

        return;

    }


    if (
        low.includes("status")
    ) {

        alex(
            "A.L.E.X is online. Archive and voice systems are ready."
        );

        return;

    }


    if (
        low.includes("who are you")
    ) {

        alex(
            "I am A.L.E.X, your personal assistant interface."
        );

        return;

    }


    alex(
        "Command received. I can control the archive, navigate suits, add suits and remove suits."
    );

}


/* =========================================================
   ALEX
   ========================================================= */

let lastSpeech = "";


function alex(
    text
) {

    lastSpeech = text;

    addChat(
        "ALEX",
        text
    );

    setStatus(
        "RESPONDING"
    );

    setTimeout(
        function() {

            setStatus(
                "STANDBY"
            );

        },
        900
    );

}


function setStatus(
    value
) {

    status.textContent =
        value;

    status.classList.toggle(
        "active",
        value !== "STANDBY"
    );

}


/* =========================================================
   SPEAK
   ========================================================= */

function speakLast() {

    if (!lastSpeech) {

        alex(
            "Nothing is currently in my speech queue."
        );

        return;

    }

    if (
        !window.speechSynthesis
    ) {

        alex(
            "Speech synthesis is not supported by this browser."
        );

        return;

    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            lastSpeech
        );

    utterance.lang =
        "en-GB";

    utterance.rate =
        .95;

    utterance.pitch =
        1;

    speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   MICROPHONE
   ========================================================= */

let recognition =
    null;

let listening =
    false;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.lang =
        "en-GB";


    recognition.onstart =
        function() {

            listening =
                true;

            micButton.textContent =
                "MIC ON";

            micButton.classList.add(
                "listening"
            );

            setStatus(
                "LISTENING"
            );

        };


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0]
                    .transcript;

            input.value =
                text;

            addChat(
                "USER",
                text
            );

            processCommand(
                text
            );

        };


    recognition.onerror =
        function(event) {

            console.log(
                "Speech recognition:",
                event.error
            );

            if (
                event.error ===
                "not-allowed"
            ) {

                alex(
                    "Microphone permission was denied. Allow microphone access in your browser."
                );

            }

        };


    recognition.onend =
        function() {

            listening =
                false;

            micButton.textContent =
                "MIC OFF";

            micButton.classList.remove(
                "listening"
            );

            setStatus(
                "STANDBY"
            );

        };

}


function toggleMic() {

    if (!recognition) {

        alex(
            "Built-in speech recognition is unavailable in this browser. Chrome or Edge is recommended."
        );

        return;

    }


    if (listening) {

        recognition.stop();

        return;

    }


    try {

        recognition.start();

    } catch (error) {

        console.log(
            error
        );

    }

}


/* =========================================================
   ARCHIVE OPEN
   ========================================================= */

function openArchive() {

    home.style.display =
        "none";

    suitScreen.classList.remove(
        "active"
    );

    archiveScreen.classList.add(
        "active"
    );

    renderArchive();

}


/* =========================================================
   ARCHIVE CLOSE
   ========================================================= */

function closeArchive() {

    archiveScreen.classList.remove(
        "active"
    );

    suitScreen.classList.remove(
        "active"
    );

    home.style.display =
        "flex";

}


/* =========================================================
   RENDER ARCHIVE
   ========================================================= */

function renderArchive() {

    const list =
        document.getElementById(
            "suitList"
        );

    list.innerHTML = "";


    if (!suits.length) {

        selectedIndex =
            -1;

        list.innerHTML =

            `<div class="empty-archive">

                ARCHIVE EMPTY

                <br><br>

                No suits are currently stored.

                <br>

                Select <b>+ ADD SUIT</b>
                to import your first suit.

            </div>`;

        document
            .getElementById(
                "selectedImage"
            )
            .removeAttribute(
                "src"
            );

        document
            .getElementById(
                "selectedName"
            )
            .textContent =
            "NO SUIT SELECTED";

        document
            .getElementById(
                "selectedDescription"
            )
            .textContent =
            "The archive is waiting for your first suit.";

        return;

    }


    if (
        selectedIndex < 0 ||
        selectedIndex >= suits.length
    ) {

        selectedIndex =
            0;

    }


    suits.forEach(
        function(
            suit,
            index
        ) {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "suit-card" +
                (
                    index === selectedIndex
                        ? " selected"
                        : ""
                );


            card.onclick =
                function() {

                    selectedIndex =
                        index;

                    renderArchive();

                };


            card.innerHTML =

                `<img
                    class="suit-thumb"
                    src="${escapeAttribute(suit.image)}"
                    alt=""
                >

                <div class="suit-info">

                    <div class="suit-name">
                        ${escapeHTML(suit.name)}
                    </div>

                    <div class="suit-era">
                        ${escapeHTML(suit.era)}
                    </div>

                </div>`;


            list.appendChild(
                card
            );

        }
    );


    const selected =
        suits[selectedIndex];


    document
        .getElementById(
            "selectedImage"
        )
        .src =
        selected.image;


    document
        .getElementById(
            "selectedName"
        )
        .textContent =
        selected.name;


    document
        .getElementById(
            "selectedDescription"
        )
        .textContent =
        selected.description;

}


/* =========================================================
   NEXT
   ========================================================= */

function nextSuit() {

    if (!suits.length) {

        toast(
            "ARCHIVE IS EMPTY"
        );

        return;

    }

    selectedIndex =
        (
            selectedIndex + 1
        ) % suits.length;

    renderArchive();

}


/* =========================================================
   PREVIOUS
   ========================================================= */

function previousSuit() {

    if (!suits.length) {

        toast(
            "ARCHIVE IS EMPTY"
        );

        return;

    }

    selectedIndex =
        (
            selectedIndex -
            1 +
            suits.length
        ) % suits.length;

    renderArchive();

}


/* =========================================================
   OPEN SUIT
   ========================================================= */

function openSelectedSuit() {

    if (
        !suits.length ||
        selectedIndex < 0
    ) {

        toast(
            "NO SUIT SELECTED"
        );

        return;

    }


    const suit =
        suits[selectedIndex];


    document
        .getElementById(
            "suitLargeImage"
        )
        .src =
        suit.image;


    document
        .getElementById(
            "suitLargeName"
        )
        .textContent =
        suit.name;


    document
        .getElementById(
            "suitLargeDescription"
        )
        .textContent =
        suit.description;


    archiveScreen.classList.remove(
        "active"
    );

    suitScreen.classList.add(
        "active"
    );

}


/* =========================================================
   CLOSE SUIT
   ========================================================= */

function closeSuitView() {

    suitScreen.classList.remove(
        "active"
    );

    home.style.display =
        "flex";

}


/* =========================================================
   SUIT VIEW NAVIGATION
   ========================================================= */

function previousSuitFromView() {

    if (!suits.length)
        return;

    previousSuit();

    openSelectedSuit();

}


function nextSuitFromView() {

    if (!suits.length)
        return;

    nextSuit();

    openSelectedSuit();

}


/* =========================================================
   DELETE SUIT
   ========================================================= */

function deleteSelectedSuit() {

    if (
        !suits.length ||
        selectedIndex < 0
    ) {

        toast(
            "NO SUIT SELECTED"
        );

        return;

    }


    const suit =
        suits[selectedIndex];


    const confirmed =
        confirm(
            "DELETE " +
            suit.name +
            " FROM THE A.L.E.X ARCHIVE?"
        );


    if (!confirmed) {

        return;

    }


    suits.splice(
        selectedIndex,
        1
    );


    if (!suits.length) {

        selectedIndex =
            -1;

    } else if (
        selectedIndex >=
        suits.length
    ) {

        selectedIndex =
            suits.length - 1;

    }


    saveSuits();

    renderArchive();

    toast(
        "SUIT DELETED"
    );

}


/* =========================================================
   ADD SUIT
   ========================================================= */

document
    .getElementById(
        "suitFile"
    )
    .addEventListener(
        "change",
        function(event) {

            const files =
                Array.from(
                    event.target.files
                );


            if (!files.length)
                return;


            files.forEach(
                function(file) {

                    if (
                        !file.type.startsWith(
                            "image/"
                        )
                    ) {

                        return;

                    }


                    const reader =
                        new FileReader();


                    reader.onload =
                        function(e) {

                            const cleanName =
                                file.name
                                    .replace(
                                        /\.[^/.]+$/,
                                        ""
                                    )
                                    .replace(
                                        /[_-]+/g,
                                        " "
                                    )
                                    .trim();


                            const displayName =
                                cleanName
                                    ? cleanName
                                        .toUpperCase()
                                    : "CUSTOM SUIT";


                            const description =
                                generateDescription(
                                    displayName,
                                    file
                                );


                            suits.push({

                                name:
                                    displayName,

                                era:
                                    "CUSTOM",

                                image:
                                    e.target.result,

                                description:
                                    description,

                                added:
                                    new Date()
                                        .toISOString()

                            });


                            selectedIndex =
                                suits.length - 1;


                            saveSuits();

                            renderArchive();


                            toast(
                                "SUIT ADDED"
                            );

                        };


                    reader.readAsDataURL(
                        file
                    );

                }
            );


            event.target.value =
                "";

        }
    );


/* =========================================================
   AUTOMATIC SUIT DESCRIPTION
   =========================================================
   This is intentionally local and does not use an AI API.
   It uses the imported suit name/file metadata.
   ========================================================= */

function generateDescription(
    name,
    file
) {

    const lower =
        name.toLowerCase();


    let type =
        "custom suit concept";


    if (
        lower.includes("black") ||
        lower.includes("stealth")
    ) {

        type =
            "dark, stealth-oriented suit concept";

    }

    else if (
        lower.includes("red") ||
        lower.includes("classic")
    ) {

        type =
            "classic red-toned suit concept";

    }

    else if (
        lower.includes("iron") ||
        lower.includes("metal")
    ) {

        type =
            "advanced metallic suit concept";

    }

    else if (
        lower.includes("white")
    ) {

        type =
            "light-toned suit concept";

    }

    else if (
        lower.includes("2099")
    ) {

        type =
            "futuristic suit concept";

    }

    else if (
        lower.includes("stealth")
    ) {

        type =
            "stealth suit concept";

    }


    const sizeKB =
        Math.round(
            file.size / 1024
        );


    return (
        "A.L.E.X archive entry for " +
        name +
        ". " +
        "This appears to be a " +
        type +
        ". " +
        "Imported image size: " +
        sizeKB +
        " KB. " +
        "The design is stored as a custom suit concept."
    );

}


/* =========================================================
   WAVE
   ========================================================= */

function resizeWave() {

    const rect =
        wave.getBoundingClientRect();


    const ratio =
        window.devicePixelRatio ||
        1;


    wave.width =
        rect.width * ratio;


    wave.height =
        rect.height * ratio;


    ctx.setTransform(
        ratio,
        0,
        0,
        ratio,
        0,
        0
    );

}


let waveTime =
    0;


function drawWave() {

    const width =
        wave.clientWidth;

    const height =
        wave.clientHeight;


    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    waveTime +=
        listening
            ? .095
            : .045;


    const bars =
        65;


    const center =
        height / 2;


    for (
        let i = 0;
        i < bars;
        i++
    ) {

        const x =
            (
                i /
                (bars - 1)
            ) * width;


        const distance =
            Math.abs(
                i -
                (bars - 1) / 2
            );


        const envelope =
            Math.max(
                0,
                1 -
                distance /
                (bars * .58)
            );


        const wave1 =
            Math.sin(
                i * .28 +
                waveTime
            );


        const wave2 =
            Math.sin(
                i * .11 -
                waveTime * 1.7
            );


        const movement =
            Math.abs(wave1) * .7 +
            Math.abs(wave2) * .3;


        const boost =
            listening
                ? 1.8
                : 1;


        const barHeight =
            6 +
            movement *
            72 *
            envelope *
            boost;


        ctx.beginPath();


        ctx.moveTo(
            x,
            center - barHeight
        );


        ctx.lineTo(
            x,
            center + barHeight
        );


        ctx.strokeStyle =
            i % 2
                ? "#39ff14"
                : "#19d9ff";


        ctx.lineWidth =
            2;


        ctx.shadowBlur =
            8;


        ctx.shadowColor =
            i % 2
                ? "#39ff14"
                : "#19d9ff";


        ctx.stroke();

    }


    ctx.shadowBlur =
        0;


    requestAnimationFrame(
        drawWave
    );

}


window.addEventListener(
    "resize",
    resizeWave
);


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer =
    null;


function toast(
    text
) {

    const element =
        document.getElementById(
            "toast"
        );


    element.textContent =
        text;


    element.classList.add(
        "show"
    );


    clearTimeout(
        toastTimer
    );


    toastTimer =
        setTimeout(
            function() {

                element.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =========================================================
   ESCAPE
   ========================================================= */

function escapeHTML(
    value
) {

    return String(value)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    value
) {

    return escapeHTML(value);

}

   START

resizeWave();

drawWave();

addChat(

);
