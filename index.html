<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="mobile-web-app-capable"
content="yes">

<meta name="apple-mobile-web-app-status-bar-style"
content="black-translucent">

<meta name="theme-color"
content="#05070a">

<title>Alex Mobile</title>

<style>

:root{
  --bg:#05070a;
  --cyan:#19d9ff;
  --green:#9cff19;
  --muted:#7f8b98;
  --red:#ff5264;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:#f4f7fa;
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    sans-serif;
}

body{
  overflow:hidden;
}

.app{
  height:100dvh;

  display:flex;
  flex-direction:column;

  padding:
    env(safe-area-inset-top)
    18px
    env(safe-area-inset-bottom);

  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(25,217,255,.08),
      transparent 30%
    ),
    #05070a;
}


/* HEADER */

header{
  height:74px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-weight:700;
  letter-spacing:.24em;
  font-size:18px;
}

.online{
  font-size:10px;
  letter-spacing:.16em;
  color:#ffd84d;
}

.online:before{
  content:"";

  display:inline-block;

  width:7px;
  height:7px;

  border-radius:50%;

  background:#ffd84d;

  box-shadow:0 0 12px #ffd84d;

  margin-right:7px;
}

.online.ready{
  color:var(--green);
}

.online.ready:before{
  background:var(--green);
  box-shadow:0 0 12px var(--green);
}

.online.error{
  color:var(--red);
}

.online.error:before{
  background:var(--red);
  box-shadow:0 0 12px var(--red);
}


/* MAIN */

main{
  flex:1;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  min-height:0;
}

.status{
  font-size:11px;
  letter-spacing:.22em;

  color:var(--muted);

  margin-bottom:26px;

  text-align:center;
}


/* ORB */

.orb{
  width:min(62vw,260px);

  aspect-ratio:1;

  border-radius:50%;

  position:relative;

  display:grid;
  place-items:center;
}

.orb:before,
.orb:after{
  content:"";

  position:absolute;
  inset:0;

  border-radius:50%;

  border:
    1px solid
    rgba(25,217,255,.35);

  box-shadow:
    0 0 35px rgba(25,217,255,.08),
    inset 0 0 35px rgba(156,255,25,.05);
}

.orb:after{
  inset:13%;

  border-color:
    rgba(156,255,25,.35);

  animation:
    pulse 2.6s ease-in-out infinite;
}


/* WAVE */

.wave{
  width:72%;
  height:72%;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:4px;
}

.bar{
  width:3px;

  border-radius:4px;

  height:22%;

  background:
    linear-gradient(
      180deg,
      var(--cyan),
      var(--green)
    );

  box-shadow:
    0 0 10px
    rgba(25,217,255,.5);

  animation:
    breathe
    1.05s
    ease-in-out
    infinite
    alternate;
}

.bar:nth-child(2){
  animation-delay:.08s;
}

.bar:nth-child(3){
  animation-delay:.16s;
}

.bar:nth-child(4){
  animation-delay:.24s;
}

.bar:nth-child(5){
  animation-delay:.32s;
}

.bar:nth-child(6){
  animation-delay:.40s;
}

.bar:nth-child(7){
  animation-delay:.48s;
}

.loading .bar{
  animation-duration:1.3s;
}

.listening .bar{
  animation-duration:.42s;
}

.thinking .bar{
  animation-duration:.75s;
}

.speaking .bar{
  animation-duration:.25s;
}


/* TEXT */

.prompt{
  margin-top:34px;

  text-align:center;

  color:#d9e0e7;

  font-size:17px;

  max-width:340px;

  line-height:1.45;

  min-height:52px;

  overflow:auto;

  word-wrap:break-word;
}

.sub{
  margin-top:8px;

  color:#65717d;

  font-size:12px;

  text-align:center;

  max-width:340px;
}


/* CONTROLS */

.controls{
  height:190px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:18px;
}

.mic{
  width:76px;
  height:76px;

  border-radius:50%;

  border:
    1px solid
    rgba(156,255,25,.5);

  background:
    linear-gradient(
      145deg,
      rgba(25,217,255,.12),
      rgba(156,255,25,.08)
    );

  color:white;

  font-size:28px;

  box-shadow:
    0 0 30px
    rgba(25,217,255,.12);

  -webkit-tap-highlight-color:
    transparent;
}

.mic:active{
  transform:scale(.95);
}

.mic:disabled{
  opacity:.3;
}

.hint{
  font-size:10px;

  letter-spacing:.2em;

  color:#687580;
}


/* NAV */

nav{
  height:72px;

  display:flex;

  align-items:center;
  justify-content:space-around;

  border-top:
    1px solid
    rgba(255,255,255,.06);
}

nav button{
  background:none;

  border:0;

  color:#6d7882;

  font:
    11px
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  letter-spacing:.08em;

  padding:10px;
}

nav button.active{
  color:var(--green);
}


/* ANIMATIONS */

@keyframes breathe{

  to{
    height:65%;
  }

}

@keyframes pulse{

  50%{
    transform:scale(1.06);
    opacity:.55;
  }

}

</style>

</head>


<body>


<div class="app">


<header>

  <div class="brand">
    ALEX
  </div>

  <div
    id="online"
    class="online"
  >
    AI LOADING
  </div>

</header>


<main>


  <div
    id="status"
    class="status"
  >
    STARTING
  </div>


  <div
    id="orb"
    class="orb loading"
  >

    <div class="wave">

      <i class="bar"></i>
      <i class="bar"></i>
      <i class="bar"></i>
      <i class="bar"></i>
      <i class="bar"></i>
      <i class="bar"></i>
      <i class="bar"></i>

    </div>

  </div>


  <div
    id="prompt"
    class="prompt"
  >
    Starting Alex's neural core…
  </div>


  <div
    id="sub"
    class="sub"
  >
    Local AI • No API key
  </div>


</main>


<section class="controls">

  <button
    class="mic"
    id="mic"
    aria-label="Talk to Alex"
    disabled
  >
    ◉
  </button>

  <div class="hint">
    TAP TO SPEAK
  </div>

</section>


<nav>

  <button class="active">
    CHAT
  </button>

  <button>
    VOICE
  </button>

  <button>
    NAVIGATE
  </button>

  <button>
    MORE
  </button>

</nav>


</div>


<script type="module">


/* ============================================================
   ALEX MOBILE
   LOCAL AI
============================================================ */


import * as webllm
from "https://esm.run/@mlc-ai/web-llm";


/* ============================================================
   ELEMENTS
============================================================ */

const $ =
  id =>
    document.getElementById(id);


const status =
  $("status");

const prompt =
  $("prompt");

const sub =
  $("sub");

const orb =
  $("orb");

const mic =
  $("mic");

const online =
  $("online");


/* ============================================================
   VARIABLES
============================================================ */

let engine =
  null;

let recognition =
  null;

let listening =
  false;

let aiReady =
  false;


/* ============================================================
   MEMORY
============================================================ */

const conversation = [

  {
    role:"system",

    content:`

You are ALEX.

You are a personal mobile AI assistant.

Be intelligent, friendly, helpful and
conversational.

Keep normal answers concise and natural.

Your responses may be spoken aloud.

Do not call yourself Gemini.

Do not mention implementation details
unless specifically asked.

`
  }

];


/* ============================================================
   STATE
============================================================ */

function setState(state){

  orb.className =
    "orb " + state;


  if(state === "loading"){

    status.textContent =
      "LOADING AI";

  }

  else if(state === "listening"){

    status.textContent =
      "LISTENING";

  }

  else if(state === "thinking"){

    status.textContent =
      "THINKING";

  }

  else if(state === "speaking"){

    status.textContent =
      "SPEAKING";

  }

  else{

    status.textContent =
      "READY";

  }

}


/* ============================================================
   LOAD MODEL
============================================================ */

async function loadAI(){

  try{


    setState(
      "loading"
    );


    online.textContent =
      "LOADING";


    prompt.textContent =
      "Loading Alex's local AI…";


    sub.textContent =
      "Preparing neural core";


    console.log(
      "ALEX: WebLLM loaded"
    );


    /* ==========================================
       FIND A SMALL REGISTERED MODEL
    ========================================== */

    const config =
      webllm.prebuiltAppConfig;


    const models =
      config.model_list;


    const model =
      models.find(
        item =>
          item.model_id
          ===
          "SmolLM2-360M-Instruct-q4f32_1-MLC"
      );


    if(!model){

      throw new Error(
        "Small SmolLM2 model was not found in the WebLLM registry."
      );

    }


    console.log(
      "ALEX MODEL:",
      model.model_id
    );


    online.textContent =
      "DOWNLOADING";


    prompt.textContent =
      "Downloading Alex's neural core…";


    sub.textContent =
      "First launch only";


    /* ==========================================
       CREATE ENGINE
    ========================================== */

    engine =

      await webllm.CreateMLCEngine(

        model.model_id,

        {

          initProgressCallback:
            progress => {

              console.log(
                "ALEX PROGRESS:",
                progress
              );


              if(
                progress &&
                typeof progress.progress
                ===
                "number"
              ){

                const percent =
                  Math.round(
                    progress.progress * 100
                  );


                online.textContent =
                  percent + "%";


                sub.textContent =
                  "Local AI • " +
                  percent +
                  "%";


                if(
                  progress.text
                ){

                  prompt.textContent =
                    progress.text;

                }

              }

            }

        }

      );


    /* ==========================================
       READY
    ========================================== */

    engine.setInitProgressCallback?.(
      () => {}
    );


    aiReady =
      true;


    mic.disabled =
      false;


    online.textContent =
      "AI ONLINE";


    online.className =
      "online ready";


    setState(
      "ready"
    );


    prompt.textContent =
      "Alex is ready.";


    sub.textContent =
      "Local AI • No API • Voice enabled";


    console.log(
      "ALEX: READY"
    );


  }


  catch(error){

    console.error(
      "ALEX ERROR:",
      error
    );


    online.textContent =
      "AI ERROR";


    online.className =
      "online error";


    setState(
      "ready"
    );


    prompt.textContent =
      "Alex couldn't load.";


    sub.textContent =
      error?.message ||
      String(error);

  }

}


/* ============================================================
   ASK ALEX
============================================================ */

async function askAlex(text){

  if(
    !aiReady ||
    !engine
  ){

    return;

  }


  setState(
    "thinking"
  );


  prompt.textContent =
    "Thinking…";


  conversation.push({

    role:
      "user",

    content:
      text

  });


  try{


    const result =

      await engine.chat.completions.create({

        messages:
          conversation,

        temperature:
          .7,

        max_tokens:
          200

      });


    const answer =

      result
        ?.choices
        ?.[0]
        ?.message
        ?.content
        ?.trim();


    if(!answer){

      throw new Error(
        "Alex returned no response."
      );

    }


    conversation.push({

      role:
        "assistant",

      content:
        answer

    });


    prompt.textContent =
      answer;


    speak(
      answer
    );


  }


  catch(error){

    console.error(
      "CHAT ERROR:",
      error
    );


    setState(
      "ready"
    );


    prompt.textContent =
      "I couldn't process that.";

  }

}


/* ============================================================
   TEXT TO SPEECH
============================================================ */

function speak(text){

  if(
    !("speechSynthesis" in window)
  ){

    setState(
      "ready"
    );

    return;

  }


  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  utterance.lang =
    "en-GB";


  utterance.rate =
    .94;


  utterance.pitch =
    1.03;


  const voices =
    speechSynthesis.getVoices();


  const voice =
    voices.find(
      v =>
        v.lang === "en-GB"
    );


  if(voice){

    utterance.voice =
      voice;

  }


  utterance.onstart =
    () => {

      setState(
        "speaking"
      );

    };


  utterance.onend =
    () => {

      setState(
        "ready"
      );

    };


  utterance.onerror =
    () => {

      setState(
        "ready"
      );

    };


  speechSynthesis.speak(
    utterance
  );

}


/* ============================================================
   SPEECH RECOGNITION
============================================================ */

function setupRecognition(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SR){

    prompt.textContent =
      "Speech recognition isn't available.";

    return null;

  }


  const r =
    new SR();


  r.lang =
    "en-GB";


  r.interimResults =
    false;


  r.continuous =
    false;


  r.maxAlternatives =
    1;


  r.onstart =
    () => {

      listening =
        true;


      setState(
        "listening"
      );


      prompt.textContent =
        "I'm listening…";

    };


  r.onresult =
    event => {

      const text =
        event
          .results[0][0]
          .transcript
          .trim();


      listening =
        false;


      prompt.textContent =
        "“" + text + "”";


      askAlex(
        text
      );

    };


  r.onerror =
    () => {

      listening =
        false;


      setState(
        "ready"
      );


      prompt.textContent =
        "I couldn't hear that.";

    };


  r.onend =
    () => {

      listening =
        false;

    };


  return r;

}


/* ============================================================
   MICROPHONE
============================================================ */

mic.onclick =
  () => {

    if(!aiReady){

      return;

    }


    if(listening){

      recognition?.stop();

      return;

    }


    recognition =
      recognition ||
      setupRecognition();


    if(recognition){

      try{

        recognition.start();

      }

      catch(error){

        console.log(
          error
        );

      }

    }

  };


/* ============================================================
   VOICES
============================================================ */

if(
  "speechSynthesis"
  in window
){

  speechSynthesis.getVoices();


  speechSynthesis.onvoiceschanged =
    () => {

      speechSynthesis.getVoices();

    };

}


/* ============================================================
   START
============================================================ */

loadAI();


</script>


</body>

</html>
