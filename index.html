<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#05070a">
<title>Alex Mobile v0.2</title>

<style>
:root{--bg:#05070a;--cyan:#19d9ff;--green:#9cff19;--muted:#7f8b98}
*{box-sizing:border-box}

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:var(--bg);
  color:#f4f7fa;
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display",sans-serif
}

body{overflow:hidden}

.app{
  height:100dvh;
  display:flex;
  flex-direction:column;
  padding:env(safe-area-inset-top) 18px env(safe-area-inset-bottom);
  background:
    radial-gradient(circle at 50% 42%,rgba(25,217,255,.08),transparent 30%),
    #05070a
}

header{
  height:74px;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.brand{
  font-weight:700;
  letter-spacing:.24em;
  font-size:18px
}

.online{
  font-size:10px;
  letter-spacing:.16em;
  color:var(--green)
}

.online:before{
  content:"";
  display:inline-block;
  width:7px;
  height:7px;
  border-radius:50%;
  background:var(--green);
  box-shadow:0 0 12px var(--green);
  margin-right:7px
}

main{
  flex:1;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  min-height:0
}

.status{
  font-size:11px;
  letter-spacing:.22em;
  color:var(--muted);
  margin-bottom:26px
}

.orb{
  width:min(62vw,260px);
  aspect-ratio:1;
  border-radius:50%;
  position:relative;
  display:grid;
  place-items:center
}

.orb:before,
.orb:after{
  content:"";
  position:absolute;
  inset:0;
  border-radius:50%;
  border:1px solid rgba(25,217,255,.35);
  box-shadow:
    0 0 35px rgba(25,217,255,.08),
    inset 0 0 35px rgba(156,255,25,.05)
}

.orb:after{
  inset:13%;
  border-color:rgba(156,255,25,.35);
  animation:pulse 2.6s ease-in-out infinite
}

.wave{
  width:72%;
  height:72%;
  border-radius:50%;
  display:flex;
  align-items:center;
  justify-content:center;
  gap:4px
}

.bar{
  width:3px;
  border-radius:4px;
  height:22%;
  background:linear-gradient(180deg,var(--cyan),var(--green));
  box-shadow:0 0 10px rgba(25,217,255,.5);
  animation:breathe 1.05s ease-in-out infinite alternate
}

.bar:nth-child(2){animation-delay:.08s}
.bar:nth-child(3){animation-delay:.16s}
.bar:nth-child(4){animation-delay:.24s}
.bar:nth-child(5){animation-delay:.32s}
.bar:nth-child(6){animation-delay:.4s}
.bar:nth-child(7){animation-delay:.48s}

.listening .bar{animation-duration:.42s}
.thinking .bar{animation-duration:.9s}
.speaking .bar{animation-duration:.25s}

.prompt{
  margin-top:34px;
  text-align:center;
  color:#d9e0e7;
  font-size:17px;
  max-width:330px;
  line-height:1.45;
  min-height:52px
}

.sub{
  margin-top:8px;
  color:#65717d;
  font-size:12px
}

.controls{
  height:190px;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:center;
  gap:18px
}

.mic{
  width:76px;
  height:76px;
  border-radius:50%;
  border:1px solid rgba(156,255,25,.5);
  background:linear-gradient(
    145deg,
    rgba(25,217,255,.12),
    rgba(156,255,25,.08)
  );
  color:white;
  font-size:28px;
  box-shadow:0 0 30px rgba(25,217,255,.12);
  -webkit-tap-highlight-color:transparent
}

.mic:active{transform:scale(.95)}

.hint{
  font-size:10px;
  letter-spacing:.2em;
  color:#687580
}

nav{
  height:72px;
  display:flex;
  align-items:center;
  justify-content:space-around;
  border-top:1px solid rgba(255,255,255,.06)
}

nav button{
  background:none;
  border:0;
  color:#6d7882;
  font:11px -apple-system,BlinkMacSystemFont,sans-serif;
  letter-spacing:.08em;
  padding:10px
}

nav button.active{color:var(--green)}

@keyframes breathe{
  to{height:65%}
}

@keyframes pulse{
  50%{
    transform:scale(1.06);
    opacity:.55
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">ALEX</div>
  <div class="online">ONLINE</div>
</header>

<main>

  <div id="status" class="status">READY</div>

  <div id="orb" class="orb">
    <div class="wave">
      <i class="bar"></i>
      <i class="bar"></i>
      <i class="bar"></i>
      <i class="bar"></i>
      <i class="bar"></i>
      <i class="bar"></i>
      <i class="bar"></i>
    </div>
  </div>

  <div id="prompt" class="prompt">
    Tap the microphone and talk to Alex.
  </div>

  <div id="sub" class="sub">
    Voice input • Gemini AI • iPhone speaker
  </div>

</main>

<section class="controls">

  <button class="mic" id="mic" aria-label="Talk to Alex">
    ◉
  </button>

  <div class="hint">
    TAP TO SPEAK
  </div>

</section>

<nav>
  <button class="active">CHAT</button>
  <button>VOICE</button>
  <button>NAVIGATE</button>
  <button>MORE</button>
</nav>

</div>

<script>

/* ============================================================
   ALEX MOBILE v0.2
   Gemini AI voice assistant
   ============================================================ */


/* ------------------------------------------------------------
   1. GEMINI API KEY
   ------------------------------------------------------------

   PASTE YOUR KEY BETWEEN THE QUOTES.

   Example:

   const GEMINI_API_KEY = "AIza....";

   DO NOT put spaces or extra quotes around the key.
------------------------------------------------------------ */

const GEMINI_API_KEY = "AQ.Ab8RN6JfytDekBX2Ut1NpWR5a2oyzgu0VvxHBilVgdT9siHUbQ";


/* ------------------------------------------------------------
   2. GEMINI MODEL
------------------------------------------------------------ */

const GEMINI_MODEL = "gemini-2.5-flash-lite";


/* ------------------------------------------------------------
   3. ALEX PERSONALITY
------------------------------------------------------------ */

const ALEX_SYSTEM_PROMPT = `
You are ALEX, a personal mobile AI assistant.

Your responses are spoken aloud, so keep them natural and conversational.

Be helpful, intelligent, friendly and concise.

Do not introduce yourself as Gemini unless specifically asked.

When a question needs a detailed answer, explain it clearly but avoid unnecessary filler.

The user is speaking to you through a voice assistant, so do not use markdown formatting unless it is genuinely useful.
`;


/* ------------------------------------------------------------
   4. PAGE ELEMENTS
------------------------------------------------------------ */

const $ = id => document.getElementById(id);

const status = $("status");
const prompt = $("prompt");
const orb = $("orb");
const mic = $("mic");

let recognition = null;
let listening = false;


/* ------------------------------------------------------------
   5. STATE CONTROL
------------------------------------------------------------ */

function setState(s){

  orb.className = "orb " + s;

  status.textContent =
    s === "listening" ? "LISTENING" :
    s === "thinking" ? "THINKING" :
    s === "speaking" ? "SPEAKING" :
    "READY";
}


/* ------------------------------------------------------------
   6. TEXT TO SPEECH
------------------------------------------------------------ */

function speak(text){

  if(!("speechSynthesis" in window)){
    setState("ready");
    return;
  }

  speechSynthesis.cancel();

  const u = new SpeechSynthesisUtterance(text);

  u.lang = "en-GB";
  u.rate = .94;
  u.pitch = 1.03;

  const voices = speechSynthesis.getVoices();

  const v =
    voices.find(x =>
      x.lang === "en-GB" &&
      /female|Samantha|Karen|Martha|Google UK English Female/i.test(x.name)
    )
    ||
    voices.find(x => x.lang === "en-GB");

  if(v) u.voice = v;

  u.onstart = () => {
    setState("speaking");
  };

  u.onend = () => {
    setState("ready");
  };

  u.onerror = () => {
    setState("ready");
  };

  speechSynthesis.speak(u);
}


/* ------------------------------------------------------------
   7. TALK TO GEMINI
------------------------------------------------------------ */

async function askGemini(text){

  setState("thinking");

  prompt.textContent = "Thinking…";

  try{

    if(
      !GEMINI_API_KEY ||
      GEMINI_API_KEY === "PASTE_YOUR_GEMINI_API_KEY_HERE"
    ){
      throw new Error("Gemini API key has not been added.");
    }


    const response = await fetch(
      "https://generativelanguage.googleapis.com/v1beta/models/"
      + GEMINI_MODEL
      + ":generateContent",
      {
        method:"POST",

        headers:{
          "Content-Type":"application/json",
          "x-goog-api-key":GEMINI_API_KEY
        },

        body:JSON.stringify({

          systemInstruction:{
            parts:[
              {
                text:ALEX_SYSTEM_PROMPT
              }
            ]
          },

          contents:[
            {
              role:"user",
              parts:[
                {
                  text:text
                }
              ]
            }
          ],

          generationConfig:{
            temperature:0.7,
            maxOutputTokens:300
          }

        })
      }
    );


    const data = await response.json();


    if(!response.ok){

      console.error("Gemini error:",data);

      throw new Error(
        data?.error?.message ||
        "Gemini returned an error."
      );
    }


    const answer =
      data?.candidates?.[0]?.content?.parts?.[0]?.text;


    if(!answer){
      throw new Error("Gemini returned no response.");
    }


    prompt.textContent = answer;

    speak(answer);


  }catch(error){

    console.error(error);

    setState("ready");

    prompt.textContent =
      "Sorry, I couldn't connect to my AI right now.";

  }

}


/* ------------------------------------------------------------
   8. SPEECH RECOGNITION
------------------------------------------------------------ */

function setupRecognition(){

  const SR =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


  if(!SR){

    prompt.textContent =
      "Voice recognition isn't available in this browser. Try Safari.";

    return null;
  }


  const r = new SR();

  r.lang = "en-GB";
  r.interimResults = false;
  r.continuous = false;
  r.maxAlternatives = 1;


  r.onstart = () => {

    listening = true;

    setState("listening");

    prompt.textContent =
      "I'm listening…";
  };


  r.onresult = e => {

    const text =
      e.results[0][0].transcript;

    listening = false;

    prompt.textContent =
      "“" + text + "”";

    askGemini(text);
  };


  r.onerror = e => {

    console.error("Speech recognition error:",e);

    listening = false;

    setState("ready");

    prompt.textContent =
      "I couldn't hear that. Tap the microphone and try again.";
  };


  r.onend = () => {

    listening = false;

    if(orb.className === "orb listening"){
      setState("ready");
    }

  };


  return r;
}


/* ------------------------------------------------------------
   9. MICROPHONE BUTTON
------------------------------------------------------------ */

mic.onclick = () => {

  if(listening){

    recognition?.stop();

    return;
  }


  recognition =
    recognition ||
    setupRecognition();


  if(recognition){

    try{

      recognition.start();

    }catch(e){

      console.log(e);

    }

  }

};


/* ------------------------------------------------------------
   10. LOAD VOICES
------------------------------------------------------------ */

if("speechSynthesis" in window){

  speechSynthesis.getVoices();

  speechSynthesis.onvoiceschanged = () => {
    speechSynthesis.getVoices();
  };

}

</script>

</body>
</html>
