<!doctype html>
<html lang="en">

<head>

<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="apple-mobile-web-app-capable"
content="yes">

<meta name="mobile-web-app-capable"
content="yes">

content="black-translucent">

content="#05070a">

<title>Alex Mobile</title>


<style>

:root{
  --bg:#05070a;
  --cyan:#19d9ff;
  --green:#9cff19;
  --muted:#7f8b98;
  --red:#ff5264;
  --yellow:#ffd84d;
}

*{
  box-sizing:border-box;
}

html,
body{
  margin:0;
  width:100%;
  height:100%;

  background:var(--bg);
  color:#f4f7fa;

  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    sans-serif;
}

body{
  overflow:hidden;
}

.app{
  height:100dvh;

  display:flex;
  flex-direction:column;

  padding:
    env(safe-area-inset-top)
    18px
    env(safe-area-inset-bottom);

  background:
    radial-gradient(
      circle at 50% 42%,
      rgba(25,217,255,.08),
      transparent 30%
    ),
    #05070a;
}


/* =========================================================
   HEADER
========================================================= */

header{
  height:74px;

  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-weight:700;
  letter-spacing:.24em;
  font-size:18px;
}

.online{
  font-size:10px;
  letter-spacing:.16em;
  color:var(--yellow);

  transition:.3s ease;
}

.online:before{
  content:"";

  display:inline-block;

  width:7px;
  height:7px;

  border-radius:50%;

  background:var(--yellow);

  box-shadow:
    0 0 12px var(--yellow);

  margin-right:7px;
}

.online.ready{
  color:var(--green);
}

.online.ready:before{
  background:var(--green);

  box-shadow:
    0 0 12px var(--green);
}

.online.error{
  color:var(--red);
}

.online.error:before{
  background:var(--red);

  box-shadow:
    0 0 12px var(--red);
}


/* =========================================================
   MAIN
========================================================= */

main{
  flex:1;

  display:flex;
  flex-direction:column;

  align-items:center;
  justify-content:center;

  min-height:0;
}

.status{
  font-size:11px;

  letter-spacing:.22em;

  color:var(--muted);

  margin-bottom:26px;

  text-align:center;
}


/* =========================================================
   ORB
========================================================= */

.orb{
  width:min(62vw,260px);

  aspect-ratio:1;

  border-radius:50%;

  position:relative;

  display:grid;
  place-items:center;
}

.orb:before,
.orb:after{
  content:"";

  position:absolute;

  inset:0;

  border-radius:50%;

  border:
    1px solid
    rgba(25,217,255,.35);

  box-shadow:
    0 0 35px
    rgba(25,217,255,.08),

    inset 0 0 35px
    rgba(156,255,25,.05);
}

.orb:after{
  inset:13%;

  border-color:
    rgba(156,255,25,.35);

  animation:
    pulse
    2.6s
    ease-in-out
    infinite;
}


/* =========================================================
   WAVEFORM
========================================================= */

.wave{
  width:72%;
  height:72%;

  display:flex;

  align-items:center;
  justify-content:center;

  gap:4px;
}

.bar{
  width:3px;

  border-radius:4px;

  height:22%;

  background:
    linear-gradient(
      180deg,
      var(--cyan),
      var(--green)
    );

  box-shadow:
    0 0 10px
    rgba(25,217,255,.5);

  animation:
    breathe
    1.05s
    ease-in-out
    infinite
    alternate;
}

.bar:nth-child(2){
  animation-delay:.08s;
}

.bar:nth-child(3){
  animation-delay:.16s;
}

.bar:nth-child(4){
  animation-delay:.24s;
}

.bar:nth-child(5){
  animation-delay:.32s;
}

.bar:nth-child(6){
  animation-delay:.40s;
}

.bar:nth-child(7){
  animation-delay:.48s;
}

.loading .bar{
  animation-duration:1.3s;
}

.listening .bar{
  animation-duration:.42s;
}

.thinking .bar{
  animation-duration:.75s;
}

.speaking .bar{
  animation-duration:.25s;

}


/* =========================================================
   TEXT
========================================================= */

.prompt{
  margin-top:34px;

  text-align:center;

  color:#d9e0e7;

  font-size:17px;

  max-width:340px;

  line-height:1.45;

  min-height:52px;

  max-height:150px;

  overflow:auto;

  word-wrap:break-word;
}

.sub{
  margin-top:8px;

  color:#65717d;

  font-size:12px;

  text-align:center;

  max-width:340px;
}


/* =========================================================
   CONTROLS
========================================================= */

.controls{
  height:190px;

  display:flex;

  flex-direction:column;

  align-items:center;
  justify-content:center;

  gap:14px;
}

.mic{
  width:76px;
  height:76px;

  border-radius:50%;

  border:
    1px solid
    rgba(156,255,25,.5);

  background:
    linear-gradient(
      145deg,
      rgba(25,217,255,.12),
      rgba(156,255,25,.08)
    );

  color:white;

  font-size:28px;

  box-shadow:
    0 0 30px
    rgba(25,217,255,.12);

  -webkit-tap-highlight-color:
    transparent;

  transition:
    transform .1s ease,
    opacity .2s ease;
}

.mic:active{
  transform:scale(.95);
}

.mic:disabled{
  opacity:.3;
}

.mic.active{
  border-color:
    rgba(156,255,25,.9);

  box-shadow:
    0 0 35px
    rgba(156,255,25,.25);
}

.hint{
  font-size:10px;

  letter-spacing:.2em;

  color:#687580;
}

.testVoice{
  background:transparent;

  border:
    1px solid
    rgba(25,217,255,.3);

  color:var(--cyan);

  border-radius:10px;

  padding:7px 12px;

  font-size:10px;

  letter-spacing:.08em;
}


/* =========================================================
   NAV
========================================================= */

nav{
  height:72px;

  display:flex;

  align-items:center;
  justify-content:space-around;

  border-top:
    1px solid
    rgba(255,255,255,.06);
}

nav button{
  background:none;

  border:0;

  color:#6d7882;

  font:
    11px
    -apple-system,
    BlinkMacSystemFont,
    sans-serif;

  letter-spacing:.08em;

  padding:10px;
}

nav button.active{
  color:var(--green);
}


/* =========================================================
   ATTRIBUTION
========================================================= */

.attribution{
  position:fixed;

  bottom:
    calc(
      env(safe-area-inset-bottom)
      + 74px
    );

  right:8px;

  font-size:8px;

  color:#39434c;

  pointer-events:none;
}


/* =========================================================
   ANIMATIONS
========================================================= */

@keyframes breathe{

  to{
    height:65%;
  }

}

@keyframes pulse{

  50%{
    transform:scale(1.06);
    opacity:.55;
  }

}

</style>

<script type="module">


/* ============================================================
   ALEX MOBILE
   LOCAL AI
   CONTINUOUS VOICE
   VOICE NAVIGATION
============================================================ */


import * as webllm from
  "https://esm.run/@mlc-ai/web-llm";


/* ============================================================
   ELEMENTS
============================================================ */

const $ =
  id =>
    document.getElementById(id);


const status =
  $("status");

const prompt =
  $("prompt");

const sub =
  $("sub");

const orb =
  $("orb");

const mic =
  $("mic");

const hint =
  $("hint");

const online =
  $("online");

const testVoiceButton =
  $("testVoice");


/* ============================================================
   VARIABLES
============================================================ */

let engine =
  null;

let recognition =
  null;

let aiReady =
  false;

let listening =
  false;

let continuousMode =
  false;

let speaking =
  false;

let recognitionRestartTimer =
  null;


/* ============================================================
   NAVIGATION STATE
============================================================ */

let navigationActive =
  false;

let navigationWatch =
  null;

let navigationSteps =
  [];

let navigationStepIndex =
  0;

let navigationDestination =
  null;

let lastNavigationAnnouncement =
  0;


/* ============================================================
   CONVERSATION
============================================================ */

const conversation = [

  {
    role:"system",

    content:`

You are ALEX.

You are a personal mobile AI assistant.

Be intelligent, friendly, helpful and
conversational.

Keep normal answers concise and natural.

Your responses may be spoken aloud.

Do not call yourself Gemini.

Do not mention implementation details
unless specifically asked.

If the user asks for navigation, do not
invent directions. The navigation system
handles real road directions separately.

`

  }

];


/* ============================================================
   STATE
============================================================ */

function setState(state){

  orb.className =
    "orb " + state;


  if(state === "loading"){

    status.textContent =
      "LOADING AI";

  }

  else if(state === "listening"){

    status.textContent =
      navigationActive
        ? "NAVIGATING"
        : "LISTENING";

  }

  else if(state === "thinking"){

    status.textContent =
      "THINKING";

  }

  else if(state === "speaking"){

    status.textContent =
      navigationActive
        ? "NAVIGATING"
        : "SPEAKING";

  }

  else{

    status.textContent =
      navigationActive
        ? "NAVIGATING"
        : "READY";

  }

}


/* ============================================================
   SPEAK
============================================================ */

function speak(
  text,
  afterSpeech = null
){

  if(
    !("speechSynthesis" in window)
  ){

    console.log(
      "Speech synthesis unavailable."
    );

    if(afterSpeech){
      afterSpeech();
    }

    return;

  }


  speaking =
    true;


  setState(
    "speaking"
  );


  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      text
    );


  /*
     IMPORTANT:

     We deliberately do not select a
     particular voice.

     Safari chooses the available
     system voice.
  */

  utterance.lang =
    "en-GB";

  utterance.rate =
    .94;

  utterance.pitch =
    1.03;

  utterance.volume =
    1.0;


  utterance.onstart =
    () => {

      console.log(
        "ALEX: speech started"
      );

      setState(
        "speaking"
      );

    };


  utterance.onend =
    () => {

      console.log(
        "ALEX: speech ended"
      );

      speaking =
        false;


      setState(
        "ready"
      );


      if(afterSpeech){

        afterSpeech();

      }

      else if(
        continuousMode &&
        !navigationActive
      ){

        startListeningSoon();

      }

    };


  utterance.onerror =
    event => {

      console.error(
        "ALEX TTS ERROR:",
        event
      );


      speaking =
        false;


      setState(
        "ready"
      );


      if(afterSpeech){

        afterSpeech();

      }

      else if(
        continuousMode &&
        !navigationActive
      ){

        startListeningSoon();

      }

    };


  speechSynthesis.speak(
    utterance
  );


  setTimeout(
    () => {

      if(
        speechSynthesis.paused
      ){

        speechSynthesis.resume();

      }

    },
    250
  );

}


/* ============================================================
   TEST VOICE
============================================================ */

function testVoice(){

  if(
    !("speechSynthesis" in window)
  ){

    prompt.textContent =
      "Speech synthesis is unavailable.";

    return;

  }


  continuousMode =
    false;


  speechSynthesis.cancel();


  const utterance =
    new SpeechSynthesisUtterance(
      "Hello. This is Alex's voice test."
    );


  utterance.lang =
    "en-GB";

  utterance.rate =
    .9;

  utterance.pitch =
    1;

  utterance.volume =
    1;


  utterance.onstart =
    () => {

      setState(
        "speaking"
      );

    };


  utterance.onend =
    () => {

      setState(
        "ready"
      );

    };


  utterance.onerror =
    event => {

      console.error(
        "VOICE TEST ERROR:",
        event
      );

      setState(
        "ready"
      );

      prompt.textContent =
        "Voice test failed.";

    };


  speechSynthesis.speak(
    utterance
  );


  setTimeout(
    () => {

      speechSynthesis.resume();

    },
    250
  );

}


testVoiceButton.onclick =
  testVoice;


/* ============================================================
   CONTINUOUS LISTENING
============================================================ */

function setupRecognition(){

  const SR =

    window.SpeechRecognition ||

    window.webkitSpeechRecognition;


  if(!SR){

    prompt.textContent =
      "Speech recognition isn't available in Safari.";

    return null;

  }


  const r =
    new SR();


  r.lang =
    "en-GB";


  r.interimResults =
    false;


  /*
     iPhone Safari may stop the recognition
     session after each phrase.

     We restart it automatically while
     continuousMode is enabled.
  */

  r.continuous =
    false;


  r.maxAlternatives =
    1;


  r.onstart =
    () => {

      listening =
        true;


      mic.classList.add(
        "active"
      );


      hint.textContent =
        "TAP TO STOP";


      setState(
        "listening"
      );


      if(!navigationActive){

        prompt.textContent =
          "I'm listening…";

      }

    };


  r.onresult =
    event => {

      const text =

        event
          .results
          [0]
          [0]
          .transcript
          .trim();


      listening =
        false;


      console.log(
        "USER:",
        text
      );


      prompt.textContent =
        "“" +
        text +
        "”";


      /*
         Check navigation first.
      */

      if(
        isNavigationRequest(text)
      ){

        stopListening();


        startNavigationFromSpeech(
          text
        );

        return;

      }


      /*
         Normal AI conversation.
      */

      askAlex(
        text
      );

    };


  r.onerror =
    event => {

      console.error(
        "ALEX SPEECH ERROR:",
        event
      );


      listening =
        false;


      if(
        continuousMode &&
        event.error !==
        "not-allowed"
      ){

        startListeningSoon();

      }

      else{

        setState(
          "ready"
        );

      }

    };


  r.onend =
    () => {

      listening =
        false;


      mic.classList.remove(
        "active"
      );


      /*
         Keep listening until the user
         taps the microphone again.
      */

      if(
        continuousMode &&
        !speaking
      ){

        startListeningSoon();

      }

      else if(
        !continuousMode
      ){

        setState(
          "ready"
        );

      }

    };


  return r;

}


/* ============================================================
   START LISTENING
============================================================ */

function startListening(){

  if(
    !aiReady
  ){

    return;

  }


  if(
    !recognition
  ){

    recognition =
      setupRecognition();

  }


  if(
    !recognition
  ){

    return;

  }


  if(
    listening
  ){

    return;

  }


  try{

    recognition.start();

  }

  catch(error){

    console.log(
      "Recognition start:",
      error
    );

  }

}


/* ============================================================
   RESTART LISTENING
============================================================ */

function startListeningSoon(){

  if(
    !continuousMode ||
    speaking ||
    navigationActive
  ){

    return;

  }


  clearTimeout(
    recognitionRestartTimer
  );


  recognitionRestartTimer =

    setTimeout(
      () => {

        if(
          continuousMode &&
          !speaking &&
          !listening
        ){

          startListening();

        }

      },
      350
    );

}


/* ============================================================
   STOP LISTENING
============================================================ */

function stopListening(){

  continuousMode =
    false;


  clearTimeout(
    recognitionRestartTimer
  );


  if(
    recognition &&
    listening
  ){

    try{

      recognition.stop();

    }

    catch(error){

      console.log(
        error
      );

    }

  }


  listening =
    false;


  mic.classList.remove(
    "active"
  );


  hint.textContent =
    "TAP TO START";


  setState(
    "ready"
  );

}


/* ============================================================
   MICROPHONE BUTTON
============================================================ */

mic.onclick =
  () => {

    if(
      !aiReady
    ){

      return;

    }


    /*
       First tap:

       unlock speech and begin
       continuous listening.
    */

    if(
      !continuousMode
    ){

      continuousMode =
        true;


      /*
         This is a user gesture,
         which is important for
         Safari speech output.
      */

      if(
        "speechSynthesis"
        in window
      ){

        speechSynthesis.cancel();

      }


      hint.textContent =
        "TAP TO STOP";


      startListening();

      return;

    }


    /*
       Second tap:

       completely stop voice mode.
    */

    stopListening();

  };


/* ============================================================
   ASK LOCAL ALEX
============================================================ */

async function askAlex(text){

  if(
    !aiReady ||
    !engine
  ){

    return;

  }


  setState(
    "thinking"
  );


  conversation.push({

    role:
      "user",

    content:
      text

  });


  try{

    const result =

      await engine
        .chat
        .completions
        .create({

          messages:
            conversation,

          temperature:
            .7,

          max_tokens:
            200

        });


    const answer =

      result
        ?.choices
        ?.[0]
        ?.message
        ?.content
        ?.trim();


    if(!answer){

      throw new Error(
        "Alex returned no response."
      );

    }


    conversation.push({

      role:
        "assistant",

      content:
        answer

    });


    prompt.textContent =
      answer;


    /*
       Voice response.

       When speech finishes,
       continuous mode automatically
       starts listening again.
    */

    speak(
      answer
    );

  }


  catch(error){

    console.error(
      "ALEX CHAT ERROR:",
      error
    );


    setState(
      "ready"
    );


    prompt.textContent =
      "I couldn't process that.";


    if(
      continuousMode
    ){

      startListeningSoon();

    }

  }

}


/* ============================================================
   NAVIGATION REQUEST DETECTION
============================================================ */

function isNavigationRequest(
  text
){

  const lower =
    text.toLowerCase();


  return (

    lower.includes(
      "take me to"
    )

    ||

    lower.includes(
      "navigate to"
    )

    ||

    lower.includes(
      "directions to"
    )

    ||

    lower.includes(
      "get me to"
    )

  );

}


/* ============================================================
   EXTRACT DESTINATION
============================================================ */

function extractDestination(
  text
){

  let destination =
    text.trim();


  destination =
    destination.replace(
      /^.*?take me to\s+/i,
      ""
    );


  destination =
    destination.replace(
      /^.*?navigate to\s+/i,
      ""
    );


  destination =
    destination.replace(
      /^.*?directions to\s+/i,
      ""
    );


  destination =
    destination.replace(
      /^.*?get me to\s+/i,
      ""
    );


  destination =
    destination.trim();


  return destination;

}


/* ============================================================
   LOCATION
============================================================ */

function getCurrentLocation(){

  return new Promise(
    (
      resolve,
      reject
    ) => {

      if(
        !navigator.geolocation
      ){

        reject(
          new Error(
            "Location is not available on this device."
          )
        );

        return;

      }


      navigator.geolocation.getCurrentPosition(

        position => {

          resolve({
            lat:
              position.coords.latitude,

            lon:
              position.coords.longitude
          });

        },

        error => {

          reject(
            new Error(
              "I couldn't access your location."
            )
          );

        },

        {

          enableHighAccuracy:
            true,

          timeout:
            15000,

          maximumAge:
            5000

        }

      );

    }

  );

}


/* ============================================================
   DISTANCE
============================================================ */

function distanceMeters(
  lat1,
  lon1,
  lat2,
  lon2
){

  const R =
    6371000;


  const p1 =
    lat1 *
    Math.PI /
    180;


  const p2 =
    lat2 *
    Math.PI /
    180;


  const dp =
    (
      lat2 -
      lat1
    ) *
    Math.PI /
    180;


  const dl =
    (
      lon2 -
      lon1
    ) *
    Math.PI /
    180;


  const a =

    Math.sin(dp / 2) *
    Math.sin(dp / 2)

    +

    Math.cos(p1) *
    Math.cos(p2) *
    Math.sin(dl / 2) *
    Math.sin(dl / 2);


  return (
    2 *
    R *
    Math.atan2(
      Math.sqrt(a),
      Math.sqrt(1-a)
    )
  );

}


/* ============================================================
   FIND PLACE
============================================================ */

async function findDestination(
  query,
  location
){

  /*
     Nominatim is only called after
     the user explicitly asks for a
     destination.
  */

  const delta =
    0.08;


  const left =
    location.lon - delta;

  const right =
    location.lon + delta;

  const top =
    location.lat + delta;

  const bottom =
    location.lat - delta;


  const params =
    new URLSearchParams({

      q:
        query,

      format:
        "jsonv2",

      limit:
        "10",

      addressdetails:
        "1",

      viewbox:
        `${left},${top},${right},${bottom}`

    });


  const url =
    "https://nominatim.openstreetmap.org/search?"
    +
    params.toString();


  const response =
    await fetch(
      url
    );


  if(
    !response.ok
  ){

    throw new Error(
      "Place search failed."
    );

  }


  const places =
    await response.json();


  if(
    !places.length
  ){

    throw new Error(
      "I couldn't find that place nearby."
    );

  }


  /*
     Sort the results by actual
     straight-line distance.
  */

  places.sort(
    (
      a,
      b
    ) => {

      const da =
        distanceMeters(

          location.lat,
          location.lon,

          Number(a.lat),
          Number(a.lon)

        );


      const db =
        distanceMeters(

          location.lat,
          location.lon,

          Number(b.lat),
          Number(b.lon)

        );


      return da - db;

    }
  );


  return places[0];

}


/* ============================================================
   START NAVIGATION
============================================================ */

async function startNavigationFromSpeech(
  text
){

  const destinationQuery =
    extractDestination(
      text
    );


  if(
    !destinationQuery
  ){

    speak(
      "Where would you like me to take you?"
    );

    return;

  }


  navigationActive =
    false;


  setState(
    "thinking"
  );


  prompt.textContent =
    "Finding " +
    destinationQuery +
    "…";


  sub.textContent =
    "Getting your location";


  try{


    const location =
      await getCurrentLocation();


    prompt.textContent =
      "Finding the nearest " +
      destinationQuery +
      "…";


    const place =
      await findDestination(
        destinationQuery,
        location
      );


    navigationDestination = {

      name:
        place.display_name,

      lat:
        Number(place.lat),

      lon:
        Number(place.lon)

    };


    await buildRoute(
      location,
      navigationDestination
    );

  }


  catch(error){

    console.error(
      "NAVIGATION ERROR:",
      error
    );


    navigationActive =
      false;


    setState(
      "ready"
    );


    prompt.textContent =
      error.message;


    speak(
      error.message
    );

  }

}


/* ============================================================
   BUILD ROUTE
============================================================ */

async function buildRoute(
  start,
  destination
){

  prompt.textContent =
    "Calculating walking route…";


  sub.textContent =
    "Voice navigation";


  const coordinates =

    `${start.lon},${start.lat};`
    +
    `${destination.lon},${destination.lat}`;


  const url =

    "https://router.project-osrm.org/route/v1/foot/"
    +
    coordinates
    +
    "?steps=true"
    +
    "&overview=false"
    +
    "&alternatives=false";


  const response =
    await fetch(
      url
    );


  if(
    !response.ok
  ){

    throw new Error(
      "The routing service isn't available."
    );

  }


  const data =
    await response.json();


  if(
    data.code !==
    "Ok"
  ){

    throw new Error(
      "I couldn't find a walking route."
    );

  }


  const route =
    data.routes?.[0];


  if(
    !route
  ){

    throw new Error(
      "No walking route was found."
    );

  }


  navigationSteps =
    route.legs
      .flatMap(
        leg =>
          leg.steps
      )
      .filter(
        step =>
          step.distance > 1
      );


  navigationStepIndex =
    0;


  navigationActive =
    true;


  lastNavigationAnnouncement =
    Date.now();


  const distance =
    Math.round(
      route.distance
    );


  const minutes =
    Math.max(
      1,
      Math.round(
        route.duration / 60
      )
    );


  /*
     Start watching the phone.
  */

  startNavigationTracking();


  /*
     Stop the normal continuous
     voice recognition while
     navigation speaks.
  */

  continuousMode =
    false;


  if(
    recognition &&
    listening
  ){

    try{

      recognition.stop();

    }

    catch(e){}

  }


  mic.classList.add(
    "active"
  );


  hint.textContent =
    "TAP TO STOP NAVIGATION";


  prompt.textContent =
    "Navigating to " +
    destination.name
      .split(",")[0];


  sub.textContent =
    `${distance} metres • about ${minutes} minutes`;


  speak(
    `Navigation started. `
    +
    `The destination is about `
    +
    formatDistance(distance)
    +
    ` away. `
    +
    getStepInstruction(
      navigationSteps[0]
    ),
    () => {

      navigationActive =
        true;

      setState(
        "ready"
      );

    }
  );

}


/* ============================================================
   FORMAT DISTANCE
============================================================ */

function formatDistance(
  meters
){

  if(
    meters < 1000
  ){

    return (
      Math.round(meters)
      +
      " metres"
    );

  }


  return (
    (meters / 1000)
      .toFixed(1)
    +
    " kilometres"
  );

}


/* ============================================================
   STEP INSTRUCTION
============================================================ */

function getStepInstruction(
  step
){

  if(
    !step
  ){

    return "Continue ahead.";

  }


  const distance =
    Math.round(
      step.distance
    );


  const maneuver =
    step.maneuver
      ?.type;


  const modifier =
    step.maneuver
      ?.modifier;


  let action =
    "Continue";


  if(
    maneuver === "turn"
  ){

    if(
      modifier === "left"
    ){

      action =
        "turn left";

    }

    else if(
      modifier === "right"
    ){

      action =
        "turn right";

    }

    else if(
      modifier === "slight left"
    ){

      action =
        "bear left";

    }

    else if(
      modifier === "slight right"
    ){

      action =
        "bear right";

    }

    else{

      action =
        "turn";

    }

  }

  else if(
    maneuver === "roundabout"
    ||
    maneuver === "rotary"
  ){

    action =
      "enter the roundabout";

  }

  else if(
    maneuver === "depart"
  ){

    action =
      "start by continuing";

  }

  else if(
    maneuver === "arrive"
  ){

    return "You have arrived.";

  }


  if(
    distance < 10
  ){

    return (
      action +
      " shortly."
    );

  }


  return (
    "In "
    +
    formatDistance(distance)
    +
    ", "
    +
    action
    +
    "."
  );

}


/* ============================================================
   NAVIGATION TRACKING
============================================================ */

function startNavigationTracking(){

  if(
    !navigator.geolocation
  ){

    return;

  }


  if(
    navigationWatch !== null
  ){

    navigator.geolocation.clearWatch(
      navigationWatch
    );

  }


  navigationWatch =

    navigator.geolocation.watchPosition(

      position => {

        if(
          !navigationActive ||
          !navigationDestination
        ){

          return;

        }


        const current = {

          lat:
            position.coords.latitude,

          lon:
            position.coords.longitude

        };


        checkNavigationProgress(
          current
        );

      },

      error => {

        console.log(
          "Navigation GPS:",
          error
        );

      },

      {

        enableHighAccuracy:
          true,

        maximumAge:
          2000,

        timeout:
          10000

      }

    );

}


/* ============================================================
   CHECK NAVIGATION
============================================================ */

function checkNavigationProgress(
  current
){

  if(
    !navigationSteps.length
  ){

    return;

  }


  const step =
    navigationSteps[
      navigationStepIndex
    ];


  if(
    !step
  ){

    finishNavigation();

    return;

  }


  const target =
    step.maneuver
      ?.location;


  if(
    !target ||
    target.length < 2
  ){

    return;

  }


  const distanceToManeuver =

    distanceMeters(

      current.lat,
      current.lon,

      Number(target[1]),
      Number(target[0])

    );


  /*
     When we're close to the next
     maneuver, announce it.
  */

  if(
    distanceToManeuver <= 18
  ){

    navigationStepIndex++;


    const nextStep =
      navigationSteps[
        navigationStepIndex
      ];


    if(!nextStep){

      finishNavigation();

      return;

    }


    const now =
      Date.now();


    if(
      now -
      lastNavigationAnnouncement
      >
      3000
    ){

      lastNavigationAnnouncement =
        now;


      const instruction =
        getStepInstruction(
          nextStep
        );


      prompt.textContent =
        instruction;


      speak(
        instruction
      );

    }


    return;

  }


  /*
     Give an advance warning roughly
     100 metres before the maneuver.
  */

  if(
    distanceToManeuver <= 110
    &&
    distanceToManeuver >= 80
  ){

    const now =
      Date.now();


    if(
      now -
      lastNavigationAnnouncement
      >
      15000
    ){

      lastNavigationAnnouncement =
        now;


      const instruction =
        getStepInstruction(
          step
        );


      prompt.textContent =
        instruction;


      speak(
        instruction
      );

    }

  }


  /*
     Display distance only; don't
     constantly speak it.
  */

  sub.textContent =
    `${Math.round(
      distanceToManeuver
    )} m to next turn`;

}


/* ============================================================
   FINISH NAVIGATION
============================================================ */

function finishNavigation(){

  navigationActive =
    false;


  if(
    navigationWatch !== null
  ){

    navigator.geolocation.clearWatch(
      navigationWatch
    );

    navigationWatch =
      null;

  }


  navigationSteps =
    [];

  navigationStepIndex =
    0;


  mic.classList.remove(
    "active"
  );


  hint.textContent =
    "TAP TO START";


  prompt.textContent =
    "You have arrived.";


  sub.textContent =
    "Navigation complete";


  speak(
    "You have arrived at your destination.",
    () => {

      setState(
        "ready"
      );

    }
  );

}


/* ============================================================
   STOP NAVIGATION
============================================================ */

function stopNavigation(){

  navigationActive =
    false;


  if(
    navigationWatch !== null
  ){

    navigator.geolocation.clearWatch(
      navigationWatch
    );

    navigationWatch =
      null;

  }


  navigationSteps =
    [];

  navigationStepIndex =
    0;


  if(
    "speechSynthesis"
    in window
  ){

    speechSynthesis.cancel();

  }


  mic.classList.remove(
    "active"
  );


  hint.textContent =
    "TAP TO START";


  setState(
    "ready"
  );


  prompt.textContent =
    "Navigation stopped.";

}


/* ============================================================
   SECOND TAP WHILE NAVIGATING
============================================================ */

mic.addEventListener(
  "click",
  () => {

    if(
      navigationActive
    ){

      stopNavigation();

    }

  }
);


/* ============================================================
   LOAD LOCAL AI
============================================================ */

async function loadAI(){

  try{


    setState(
      "loading"
    );


    online.textContent =
      "LOADING";


    prompt.textContent =
      "Loading Alex's local AI…";


    sub.textContent =
      "Preparing neural core";


    const config =
      webllm.prebuiltAppConfig;


    const models =
      config.model_list;


    const model =
      models.find(
        item =>
          item.model_id
          ===
          "SmolLM2-360M-Instruct-q4f32_1-MLC"
      );


    if(!model){

      throw new Error(
        "Small Alex model was not found."
      );

    }


    online.textContent =
      "DOWNLOADING";


    prompt.textContent =
      "Downloading Alex's neural core…";


    sub.textContent =
      "First launch only";


    engine =

      await webllm.CreateMLCEngine(

        model.model_id,

        {

          initProgressCallback:
            progress => {

              console.log(
                "ALEX PROGRESS:",
                progress
              );


              if(
                progress &&
                typeof
                progress.progress
                ===
                "number"
              ){

                const percent =
                  Math.round(
                    progress.progress *
                    100
                  );


                online.textContent =
                  percent + "%";


                sub.textContent =
                  "Local AI • "
                  +
                  percent
                  +
                  "%";


                if(
                  progress.text
                ){

                  prompt.textContent =
                    progress.text;

                }

              }

            }

        }

      );


    aiReady =
      true;


    mic.disabled =
      false;


    online.textContent =
      "AI ONLINE";


    online.className =
      "online ready";


    setState(
      "ready"
    );


    prompt.textContent =
      "Alex is ready.";


    sub.textContent =
      "Local AI • Voice • Navigation";


  }


  catch(error){

    console.error(
      "ALEX AI ERROR:",
      error
    );


    aiReady =
      false;


    mic.disabled =
      true;


    online.textContent =
      "AI ERROR";


    online.className =
      "online error";


    setState(
      "ready"
    );


    prompt.textContent =
      "Alex couldn't load.";


    sub.textContent =
      error?.message ||
      String(error);

  }

}


/* ============================================================
   LOAD SAFARI VOICES
============================================================ */

if(
  "speechSynthesis"
  in window
){

  speechSynthesis.getVoices();


  speechSynthesis.onvoiceschanged =
    () => {

      speechSynthesis.getVoices();

    };

}


/* ============================================================
   START ALEX
============================================================ */

loadAI();
