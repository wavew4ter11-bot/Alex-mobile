<script>

/* ============================================================
   A.L.E.X PHONE CORE
   100% LOCAL
   NO API
   NO OLLAMA
   NO SERVER
============================================================ */

const STORAGE_KEY = "alex_phone_archive_v3";
const MEMORY_KEY = "alex_phone_memory_v3";
const CHAT_KEY = "alex_phone_chat_v3";

let suits = [];
let selectedSuit = -1;
let selectedImageIndex = 0;

let micActive = false;
let recognition = null;

let speechEnabled = true;
let conversation = [];

let toastTimer = null;


/* ============================================================
   ELEMENTS
============================================================ */

const home = document.getElementById("home");
const archive = document.getElementById("archive");

const chat = document.getElementById("chat");

const textInput = document.getElementById("textInput");
const sendButton = document.getElementById("sendButton");

const micButton = document.getElementById("micButton");
const speakButton = document.getElementById("speakButton");

const archiveButton = document.getElementById("archiveButton");
const backButton = document.getElementById("backButton");

const addSuitButton = document.getElementById("addSuitButton");
const deleteSuitButton = document.getElementById("deleteSuitButton");

const suitListItems = document.getElementById("suitListItems");

const selectedImage = document.getElementById("selectedImage");
const imagePlaceholder = document.getElementById("imagePlaceholder");

const detailName = document.getElementById("detailName");
const detailDescription = document.getElementById("detailDescription");
const detailImageCount = document.getElementById("detailImageCount");

const previousImage = document.getElementById("previousImage");
const nextImage = document.getElementById("nextImage");

const addModal = document.getElementById("addModal");

const suitName = document.getElementById("suitName");
const suitDescription = document.getElementById("suitDescription");
const suitImages = document.getElementById("suitImages");

const saveSuitButton = document.getElementById("saveSuitButton");
const cancelSuitButton = document.getElementById("cancelSuitButton");

const status = document.getElementById("status");
const toast = document.getElementById("toast");


/* ============================================================
   STORAGE
============================================================ */

function safeJSON(key, fallback){

    try{

        const value = localStorage.getItem(key);

        if(!value)
            return fallback;

        return JSON.parse(value);

    }catch(error){

        console.warn("Storage error:",error);

        return fallback;
    }
}


function loadEverything(){

    suits = safeJSON(STORAGE_KEY,[]);

    conversation = safeJSON(CHAT_KEY,[]);

    if(!Array.isArray(suits))
        suits=[];

    if(!Array.isArray(conversation))
        conversation=[];

    conversation.slice(-40).forEach(item=>{

        if(item &&
           (item.speaker==="USER" ||
            item.speaker==="ALEX")){

            addChat(
                item.speaker,
                item.text,
                false
            );
        }
    });
}


function saveArchive(){

    try{

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(suits)
        );

    }catch(error){

        console.error(error);

        showToast("Archive storage is full.");
    }
}


function saveConversation(){

    try{

        localStorage.setItem(
            CHAT_KEY,
            JSON.stringify(
                conversation.slice(-40)
            )
        );

    }catch(error){

        console.warn(error);
    }
}


/* ============================================================
   TOAST
============================================================ */

function showToast(text){

    toast.textContent=text;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer=setTimeout(()=>{

        toast.classList.remove("show");

    },2400);
}


/* ============================================================
   TIME
============================================================ */

function currentTime(){

    return new Date().toLocaleTimeString(
        [],
        {
            hour:"2-digit",
            minute:"2-digit",
            second:"2-digit"
        }
    );
}


/* ============================================================
   CHAT
============================================================ */

function addChat(speaker,text,save=true){

    const wrapper=document.createElement("div");
    wrapper.className="chat-line";

    const time=document.createElement("div");
    time.className="chat-time";

    time.textContent=
        speaker+" // "+currentTime();

    const message=document.createElement("div");

    message.className=
        speaker==="USER"
        ? "chat-user"
        : "chat-alex";

    message.textContent=text;

    wrapper.appendChild(time);
    wrapper.appendChild(message);

    chat.appendChild(wrapper);

    chat.scrollTop=chat.scrollHeight;

    if(save){

        conversation.push({
            speaker,
            text,
            time:Date.now()
        });

        saveConversation();
    }
}


/* ============================================================
   LOCAL MEMORY
============================================================ */

function getMemory(){

    const memory=safeJSON(
        MEMORY_KEY,
        {
            name:null,
            preferences:[],
            notes:[]
        }
    );

    if(!memory || typeof memory!=="object")
        return {
            name:null,
            preferences:[],
            notes:[]
        };

    return memory;
}


function saveMemory(memory){

    try{

        localStorage.setItem(
            MEMORY_KEY,
            JSON.stringify(memory)
        );

    }catch(error){

        console.warn(error);
    }
}


/* ============================================================
   TEXT UTILITIES
============================================================ */

function cleanText(text){

    return text
        .toLowerCase()
        .replace(/[!?.,;:()[\]{}"'`]/g," ")
        .replace(/\s+/g," ")
        .trim();
}


function hasAny(text,words){

    return words.some(word=>text.includes(word));
}


function randomItem(array){

    return array[
        Math.floor(
            Math.random()*array.length
        )
    ];
}


/* ============================================================
   LOCAL A.L.E.X INTELLIGENCE
============================================================ */

function alexResponse(input){

    const original=input.trim();
    const low=cleanText(original);

    if(!low)
        return "Awaiting input.";


    /* ARCHIVE COMMANDS */

    if(
        hasAny(low,[
            "open archive",
            "open archives",
            "show archive",
            "show archives",
            "suit archive",
            "suit archives",
            "open suits",
            "show suits"
        ])
    ){

        openArchive();

        return "Opening suit archive.";
    }


    if(
        low==="archive" ||
        low==="archives" ||
        low==="suits"
    ){

        openArchive();

        return "Archive interface opened.";
    }


    if(
        hasAny(low,[
            "close archive",
            "close archives",
            "exit archive",
            "back home"
        ])
    ){

        closeArchive();

        return "Returning to main interface.";
    }


    /* GREETINGS */

    if(
        low==="hi" ||
        low==="hello" ||
        low==="hey" ||
        low.includes("hello alex") ||
        low.includes("hi alex") ||
        low.includes("hey alex")
    ){

        const memory=getMemory();

        if(memory.name){

            return randomItem([
                `Good to see you, ${memory.name}. A.L.E.X is online.`,
                `Hello, ${memory.name}. All local systems are standing by.`,
                `Welcome back, ${memory.name}.`
            ]);

        }

        return randomItem([
            "A.L.E.X online. All local systems standing by.",
            "Hello. A.L.E.X is ready.",
            "Systems online. How can I help?"
        ]);
    }


    /* WHO ARE YOU */

    if(
        hasAny(low,[
            "who are you",
            "what are you",
            "tell me about yourself"
        ])
    ){

        return "I am A.L.E.X — a local phone-based assistant interface. I run directly in this webpage without an API or external AI server.";
    }


    /* CAPABILITIES */

    if(
        hasAny(low,[
            "what can you do",
            "what do you do",
            "your capabilities",
            "capabilities"
        ])
    ){

        return "I can control this interface, use the microphone, speak responses, manage your suit archive, remember simple local preferences, report interface status, and respond to a growing library of commands.";
    }


    /* STATUS */

    if(
        low.includes("status") ||
        low.includes("system status") ||
        low.includes("systems")
    ){

        return "SYSTEM STATUS: ONLINE. Interface operational. Archive operational. Speech available. Microphone "+(recognition ? "available" : "browser support not detected")+". External AI connection: NOT REQUIRED.";
    }


    /* TIME */

    if(
        low==="time" ||
        low.includes("what time") ||
        low.includes("current time")
    ){

        return "The current time is "+currentTime()+".";
    }


    /* DATE */

    if(
        low==="date" ||
        low.includes("what date") ||
        low.includes("today")
    ){

        const now=new Date();

        return "Today is "+
            now.toLocaleDateString(
                [],
                {
                    weekday:"long",
                    year:"numeric",
                    month:"long",
                    day:"numeric"
                }
            )+".";
    }


    /* NAME MEMORY */

    const nameMatch=
        original.match(
            /(?:my name is|call me|remember me as)\s+(.+)/i
        );

    if(nameMatch){

        const name=nameMatch[1]
            .trim()
            .replace(/[.!?]+$/,"")
            .slice(0,40);

        const memory=getMemory();

        memory.name=name;

        saveMemory(memory);

        return `Understood. I'll remember your name as ${name}.`;
    }


    if(
        low.includes("what is my name") ||
        low.includes("do you know my name")
    ){

        const memory=getMemory();

        if(memory.name)
            return `Your name is ${memory.name}.`;

        return "You haven't given me a name to remember yet.";
    }


    /* MEMORY CLEAR */

    if(
        hasAny(low,[
            "forget my name",
            "forget my information",
            "clear memory"
        ])
    ){

        localStorage.removeItem(MEMORY_KEY);

        return "Local memory cleared.";
    }


    /* MICROPHONE */

    if(
        hasAny(low,[
            "turn on mic",
            "turn on microphone",
            "enable microphone",
            "start microphone"
        ])
    ){

        if(recognition){

            if(!micActive)
                toggleMicrophone();

            return "Microphone activation requested.";

        }

        return "This browser does not expose speech recognition.";
    }


    if(
        hasAny(low,[
            "turn off mic",
            "turn off microphone",
            "disable microphone"
        ])
    ){

        if(micActive)
            toggleMicrophone();

        return "Microphone disabled.";
    }


    /* SPEECH */

    if(
        hasAny(low,[
            "stop speaking",
            "be quiet",
            "silence"
        ])
    ){

        window.speechSynthesis.cancel();

        status.textContent="STANDBY";

        return "Speech stopped.";
    }


    if(
        hasAny(low,[
            "speak",
            "say something"
        ])
    ){

        return "Speech systems are operational.";
    }


    /* ARCHIVE INFORMATION */

    if(
        hasAny(low,[
            "how many suits",
            "how many suits do i have",
            "suit count"
        ])
    ){

        return `There are currently ${suits.length} suit${suits.length===1?"":"s"} in the archive.`;
    }


    if(
        hasAny(low,[
            "how many images",
            "image count"
        ])
    ){

        let total=0;

        suits.forEach(suit=>{
            total+=(suit.images||[]).length;
        });

        return `The archive currently contains ${total} stored image${total===1?"":"s"}.`;
    }


    /* LOCAL HELP */

    if(
        low==="help" ||
        low.includes("help me")
    ){

        return "Try commands such as: open archives, status, what can you do, what time is it, remember my name is..., how many suits, turn on microphone, or stop speaking.";
    }


    /* THANKS */

    if(
        hasAny(low,[
            "thank you",
            "thanks",
            "cheers"
        ])
    ){

        return randomItem([
            "You're welcome.",
            "Anytime.",
            "Glad to help.",
            "Of course."
        ]);
    }


    /* GOODBYE */

    if(
        hasAny(low,[
            "goodbye",
            "bye alex",
            "see you"
        ])
    ){

        return "Standing by. Interface remains active.";
    }


    /* SIMPLE QUESTIONS */

    if(
        low.startsWith("can you ")
    ){

        const subject=original
            .slice(7)
            .replace(/[?]+$/,"")
            .trim();

        if(
            hasAny(
                cleanText(subject),
                ["help","assist","remember","speak","listen"]
            )
        ){

            return "Yes. I can handle that locally when the required browser feature is available.";
        }

        return "I can try. My current intelligence runs locally in the webpage, so I work best with interface commands, information, memory and predefined knowledge.";
    }


    /* DEFAULT — IMPORTANT:
       DO NOT PRETEND TO BE A CLOUD AI */

    return localFallback(original);
}


/* ============================================================
   LOCAL FALLBACK ENGINE
============================================================ */

function localFallback(text){

    const low=cleanText(text);

    if(low.length<4)
        return "Input received. Please give me a little more detail.";


    if(
        low.includes("why")
    ){

        return "That's a question I can't reliably answer from my local knowledge base yet. This version deliberately has no external AI connection.";
    }


    if(
        low.includes("how")
    ){

        return "I can handle that if it matches one of my local systems. Try asking about the interface, archive, microphone, speech, memory or system status.";
    }


    if(
        low.includes("what") ||
        low.includes("where") ||
        low.includes("when")
    ){

        return "I don't have an external knowledge service connected. I can still handle local A.L.E.X commands and information stored in this phone interface.";
    }


    return randomItem([
        "Input received. I don't have that capability in my current local knowledge base yet.",
        "Understood. That request isn't in my local command library yet.",
        "I can process that locally, but I don't have enough built-in information to give you a reliable answer.",
        "Command acknowledged. My local response library doesn't contain that topic yet."
    ]);
}

function processMessage(text,shouldSpeak=true){

    const clean=text.trim();

    if(!clean)
        return;

    addChat("USER",clean);

    textInput.value="";

    status.textContent="THINKING";

    setTimeout(()=>{

        const answer=alexResponse(clean);

        if(answer){

            addChat("ALEX",answer);

            if(
                shouldSpeak &&
                speechEnabled
            ){

                speakText(answer);

            }else{

                status.textContent="STANDBY";
            }
        }

    },220);
}

/* ============================================================
   DESCRIPTION
============================================================ */

function generateDescription(name){

    const lower=name.toLowerCase();
    const upper=name.toUpperCase();

    let style="advanced superhero suit";

    if(
        lower.includes("iron") ||
        lower.includes("tech")
    ){

        style="technology-focused suit";

    }else if(
        lower.includes("stealth") ||
        lower.includes("black")
    ){

        style="stealth-oriented suit";

    }else if(
        lower.includes("classic") ||
        lower.includes("red")
    ){

        style="classic superhero suit";

    }else if(
        lower.includes("symbiote")
    ){

        style="dark symbiote-inspired suit";
    }

    return `${upper} is an ${style} concept. The design combines a distinctive visual identity with a practical superhero aesthetic. Its appearance, materials and technology can be expanded as additional archive information is added. A.L.E.X automatically generated this description from the archive name.`;
}

/* ============================================================
   FILE -> DATA URL
============================================================ */

function fileToDataURL(file){

    return new Promise(
        (resolve,reject)=>{

            const reader=new FileReader();

            reader.onload=()=>{
                resolve(reader.result);
            };

            reader.onerror=reject;

            reader.readAsDataURL(file);
        }
    );
}


/* ============================================================
   SAVE SUIT
============================================================ */

saveSuitButton.addEventListener(
    "click",
    async()=>{

        const name=suitName.value.trim();

        if(!name){

            showToast("Enter a suit name.");

            return;
        }

        const files=Array.from(
            suitImages.files
        );

        const images=[];

        try{

            for(const file of files){

                images.push(
                    await fileToDataURL(file)
                );
            }

        }catch(error){

            showToast("Could not load image.");

            return;
        }

        const description=
            suitDescription.value.trim()
            ||
            generateDescription(name);

        suits.push({

            id:Date.now(),

            name:name.toUpperCase(),

            description,

            images,

            created:new Date().toISOString()

        });

        selectedSuit=suits.length-1;
        selectedImageIndex=0;

        saveArchive();

        closeAddModal();

        renderArchive();

        showToast(
            `${name.toUpperCase()} added.`
        );
    }
);


/* ============================================================
   DELETE SUIT
============================================================ */

deleteSuitButton.addEventListener(
    "click",
    ()=>{

        if(
            selectedSuit<0 ||
            !suits[selectedSuit]
        ){

            showToast("Select a suit first.");

            return;
        }

        const name=suits[selectedSuit].name;

        if(!confirm(
            `Delete ${name} from the archive?`
        ))
            return;

        suits.splice(
            selectedSuit,
            1
        );

        if(!suits.length){

            selectedSuit=-1;

        }else{

            selectedSuit=Math.min(
                selectedSuit,
                suits.length-1
            );
        }

        selectedImageIndex=0;

        saveArchive();

        renderArchive();

        showToast(
            `${name} deleted.`
        );
    }
);


/* ============================================================
   RENDER ARCHIVE
============================================================ */

function renderArchive(){

    renderSuitList();

    renderSelectedSuit();
}


function renderSuitList(){

    suitListItems.innerHTML="";

    if(!suits.length){

        const empty=document.createElement("div");

        empty.className="empty-archive";

        empty.innerHTML=`
            <div class="empty-icon">◇</div>
            ARCHIVE EMPTY
            <br><br>
            Use + ADD SUIT to create
            your first archive entry.
        `;

        suitListItems.appendChild(empty);

        return;
    }


    suits.forEach(
        (suit,index)=>{

            const card=document.createElement("div");

            card.className="suit-card";

            if(index===selectedSuit)
                card.classList.add("selected");


            const thumb=document.createElement("img");

            thumb.className="suit-thumb";


            if(
                suit.images &&
                suit.images.length
            ){

                thumb.src=suit.images[0];

            }else{

                thumb.style.display="none";
            }


            const information=document.createElement("div");

            const name=document.createElement("div");

            name.className="suit-card-name";

            name.textContent=suit.name;


            const meta=document.createElement("div");

            meta.className="suit-card-meta";

            meta.textContent=
                `${suit.images?.length||0} IMAGE(S)`;


            information.appendChild(name);
            information.appendChild(meta);

            card.appendChild(thumb);
            card.appendChild(information);


            card.addEventListener(
                "click",
                ()=>{

                    selectedSuit=index;
                    selectedImageIndex=0;

                    renderArchive();
                }
            );


            suitListItems.appendChild(card);
        }
    );
}


/* ============================================================
   SELECTED SUIT
============================================================ */

function renderSelectedSuit(){

    if(
        selectedSuit<0 ||
        !suits[selectedSuit]
    ){

        imagePlaceholder.style.display="block";
        imagePlaceholder.textContent="SELECT A SUIT";

        selectedImage.style.display="none";

        detailName.textContent="NO SUIT SELECTED";

        detailDescription.textContent=
            "Add a suit to begin building the archive.";

        detailImageCount.textContent="0";

        return;
    }


    const suit=suits[selectedSuit];

    detailName.textContent=suit.name;

    detailDescription.textContent=
        suit.description ||
        generateDescription(suit.name);


    const images=suit.images||[];

    detailImageCount.textContent=
        String(images.length);


    if(!images.length){

        imagePlaceholder.style.display="block";

        imagePlaceholder.textContent="NO IMAGE ATTACHED";

        selectedImage.style.display="none";

        return;
    }


    if(selectedImageIndex>=images.length)
        selectedImageIndex=images.length-1;


    imagePlaceholder.style.display="none";

    selectedImage.style.display="block";

    selectedImage.src=
        images[selectedImageIndex];
}

previousImage.addEventListener(

            )%images.length;

);


/* ============================================================
   SPEECH
============================================================ */

function speakText(text){

    if(
        !speechEnabled ||
        !("speechSynthesis" in window)
    ){

        status.textContent="STANDBY";

        return;
    }


    speechSynthesis.cancel();

    const utterance=
        new SpeechSynthesisUtterance(text);

    utterance.rate=.95;
    utterance.pitch=.95;
    utterance.volume=1;


    const voices=
        speechSynthesis.getVoices();


    const preferred=
        voices.find(
            voice=>
                /en-GB/i.test(voice.lang)
        );


    if(preferred)
        utterance.voice=preferred;


    status.textContent="SPEAKING";


    utterance.onend=()=>{
        status.textContent="STANDBY";
    };


    utterance.onerror=()=>{
        status.textContent="STANDBY";
    };


    speechSynthesis.speak(utterance);
}

/* ============================================================
   MICROPHONE
============================================================ */

function setupMicrophone(){

    const SpeechRecognition=
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;


    if(!SpeechRecognition){

        recognition=null;

        return;
    }


    recognition=new SpeechRecognition();

    recognition.lang="en-GB";

    recognition.continuous=false;

    recognition.interimResults=false;

    recognition.maxAlternatives=1;


    recognition.onstart=()=>{

        micActive=true;

        micButton.textContent="MIC ON";

        micButton.classList.add("mic-active");

        status.textContent="LISTENING";
    };


    recognition.onresult=event=>{

        const transcript=
            event.results[0][0].transcript.trim();

        textInput.value=transcript;

        processMessage(
            transcript,
            true
        );
    };


    recognition.onerror=event=>{

        console.log(
            "Speech recognition:",
            event.error
        );

        showToast(
            "Microphone: "+event.error
        );

        status.textContent="STANDBY";
    };


    recognition.onend=()=>{

        micActive=false;

        micButton.textContent="MIC OFF";

        micButton.classList.remove("mic-active");

        if(status.textContent==="LISTENING")
            status.textContent="STANDBY";
    };
}


function toggleMicrophone(){

    if(!recognition){

        showToast(
            "Speech recognition is not supported here."
        );

        return;
    }


    if(micActive){

        recognition.stop();

    }else{

        try{

            recognition.start();

        }catch(error){

            console.log(error);
        }
    }
}


micButton.addEventListener(
    "click",
    toggleMicrophone
);

/* ============================================================
   WAVEFORM
============================================================ */

const canvas=
    document.getElementById("wave");

const ctx=
    canvas.getContext("2d");

let phase=0;


function resizeCanvas(){

    const rect=
        canvas.getBoundingClientRect();

    const dpr=
        window.devicePixelRatio||1;

    canvas.width=
        rect.width*dpr;

    canvas.height=
        rect.height*dpr;

    ctx.setTransform(
        dpr,0,0,dpr,0,0
    );
}


function drawWave(){

    const rect=
        canvas.getBoundingClientRect();

    const width=rect.width;
    const height=rect.height;

    ctx.clearRect(
        0,0,width,height
    );


    const center=height/2;

    const bars=61;


    for(
        let i=0;
        i<bars;
        i++
    ){

        const x=
            width/2-
            width*.43+
            i*(width*.86/(bars-1));


        const distance=
            Math.abs(
                i-(bars-1)/2
            );


        const envelope=
            Math.max(
                0,
                1-
                distance/
                ((bars-1)/2)
            );


        let activity=1;


        if(status.textContent==="LISTENING")
            activity=1.8;

        if(status.textContent==="THINKING")
            activity=1.5;

        if(status.textContent==="SPEAKING")
            activity=2;


        const movement=
            Math.abs(
                Math.sin(
                    phase+
                    i*.29
                )
            );


        const heightValue=
            5+
            movement*
            42*
            envelope*
            activity;


        ctx.beginPath();

        ctx.moveTo(
            x,
            center-heightValue
        );

        ctx.lineTo(
            x,
            center+heightValue
        );


        ctx.lineWidth=2.5;

        ctx.strokeStyle=
            "rgba(57,255,20,.85)";

        ctx.shadowColor=
            "rgba(57,255,20,.45)";

        ctx.shadowBlur=8;

        ctx.stroke();
    }


    ctx.shadowBlur=0;

    phase+=.055;

    requestAnimationFrame(drawWave);
}


window.addEventListener(
    "resize",
    resizeCanvas
);

drawWave();
