<!doctype html>
<html lang="en">

<head>
<meta charset="utf-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<meta name="theme-color"
content="#05070a">

<title>Alex Neural Core Test</title>

<style>

html,body{
  margin:0;
  width:100%;
  height:100%;
  background:#05070a;
  color:#f4f7fa;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
}

body{
  padding:28px;
  box-sizing:border-box;
}

h1{
  color:#9cff19;
  letter-spacing:.12em;
  font-size:22px;
}

.test{
  margin:12px 0;
  padding:16px;
  border:1px solid #26313a;
  border-radius:14px;
  line-height:1.5;
}

.ok{
  color:#9cff19;
}

.bad{
  color:#ff5264;
}

.info{
  color:#19d9ff;
}

#log{
  white-space:pre-wrap;
  word-break:break-word;
  font-size:12px;
  color:#9aa7b3;
}

</style>

</head>

<body>

<h1>ALEX NEURAL CORE TEST</h1>

<div id="results">

<div class="test info">
Running diagnostics…
</div>

</div>

<div class="test">
<div id="log"></div>
</div>


<script type="module">

const results =
document.getElementById("results");

const log =
document.getElementById("log");


function add(
  text,
  type="info"
){

  const div =
  document.createElement("div");

  div.className =
  "test " + type;

  div.textContent =
  text;

  results.appendChild(div);

}


function writeLog(text){

  log.textContent +=
    text + "\n";

}


async function run(){

  try{

    writeLog("1. JavaScript module system: OK");


    /* =========================
       WEBGPU
    ========================= */

    if(!navigator.gpu){

      add(
        "❌ WebGPU is unavailable.",
        "bad"
      );

      return;

    }

    add(
      "✅ WebGPU API available.",
      "ok"
    );


    const adapter =
    await navigator.gpu.requestAdapter();


    if(!adapter){

      add(
        "❌ Safari could not provide a GPU adapter.",
        "bad"
      );

      return;

    }


    add(
      "✅ GPU adapter available.",
      "ok"
    );


    writeLog(
      "WebGPU adapter obtained."
    );


    /* =========================
       GPU DEVICE
    ========================= */

    const device =
    await adapter.requestDevice();


    if(!device){

      add(
        "❌ Could not create GPU device.",
        "bad"
      );

      return;

    }


    add(
      "✅ GPU device created.",
      "ok"
    );


    writeLog(
      "GPU device created successfully."
    );


    /* =========================
       WEBLLM IMPORT
    ========================= */

    writeLog(
      "2. Loading WebLLM JavaScript package…"
    );


    const webllm =
    await import(
      "https://esm.run/@mlc-ai/web-llm"
    );


    if(!webllm){

      add(
        "❌ WebLLM package failed to load.",
        "bad"
      );

      return;

    }


    add(
      "✅ WebLLM package loaded.",
      "ok"
    );


    writeLog(
      "WebLLM module imported."
    );


    /* =========================
       ENGINE FUNCTION
    ========================= */

    if(
      typeof webllm.CreateMLCEngine
      !== "function"
    ){

      add(
        "❌ CreateMLCEngine was not found.",
        "bad"
      );

      return;

    }


    add(
      "✅ CreateMLCEngine found.",
      "ok"
    );


    /* =========================
       MODEL REGISTRY
    ========================= */

    const config =
    webllm.prebuiltAppConfig;


    if(!config){

      add(
        "❌ WebLLM model registry unavailable.",
        "bad"
      );

      return;

    }


    add(
      "✅ WebLLM model registry available.",
      "ok"
    );


    const models =
    config.model_list || [];


    writeLog(
      "Registered models: "
      + models.length
    );


    /* =========================
       FIND SMALL MODEL
    ========================= */

    const smallModel =
    models.find(
      model =>
        model.model_id &&
        model.model_id
          .toLowerCase()
          .includes("smollm")
    );


    if(smallModel){

      add(
        "✅ Small local model is registered:\n"
        + smallModel.model_id,
        "ok"
      );


      writeLog(
        "Model library: "
        + smallModel.model_lib
      );


      writeLog(
        "VRAM requirement: "
        + (
          smallModel.vram_required_MB
          || "unknown"
        )
        + " MB"
      );

    }

    else{

      add(
        "⚠️ WebLLM loaded, but the expected small model isn't in this version's registry.",
        "info"
      );

    }


    /* =========================
       FINAL
    ========================= */

    add(
      "🚀 WebLLM itself is working. No model was downloaded.",
      "ok"
    );


    writeLog(
      "DIAGNOSTIC COMPLETE."
    );

  }

  catch(error){

    console.error(
      error
    );


    add(
      "❌ DIAGNOSTIC FAILED",
      "bad"
    );


    add(
      error?.message ||
      String(error),
      "bad"
    );


    writeLog(
      "\nFULL ERROR:\n" +
      (
        error?.stack ||
        String(error)
      )
    );

  }

}


run();

</script>

</body>

</html>
