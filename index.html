<!doctype html>
<html>
<head>
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Alex WebGPU Test</title>

<style>
body{
  background:#05070a;
  color:#f4f7fa;
  font-family:-apple-system,BlinkMacSystemFont,sans-serif;
  padding:30px;
}

h1{
  color:#9cff19;
}

.test{
  padding:15px;
  margin:12px 0;
  border:1px solid #26313a;
  border-radius:12px;
}

.ok{
  color:#9cff19;
}

.bad{
  color:#ff5264;
}

.info{
  color:#19d9ff;
}
</style>
</head>

<body>

<h1>ALEX GPU TEST</h1>

<div id="results">
Running tests…
</div>

<script>

async function test(){

  const results =
    document.getElementById("results");

  let html = "";


  /* WebGPU */

  if(!navigator.gpu){

    html += `
      <div class="test bad">
        ❌ WebGPU NOT AVAILABLE
      </div>
    `;

    html += `
      <div class="test info">
        Safari is not exposing WebGPU to this page.
      </div>
    `;

    results.innerHTML = html;

    return;
  }


  html += `
    <div class="test ok">
      ✅ WebGPU API AVAILABLE
    </div>
  `;


  /* GPU adapter */

  try{

    const adapter =
      await navigator.gpu.requestAdapter();


    if(!adapter){

      html += `
        <div class="test bad">
          ❌ GPU ADAPTER NOT AVAILABLE
        </div>
      `;

      results.innerHTML = html;

      return;
    }


    html += `
      <div class="test ok">
        ✅ GPU ADAPTER FOUND
      </div>
    `;


    /* Adapter information */

    try{

      const info =
        await adapter.requestAdapterInfo();

      html += `
        <div class="test info">
          GPU:<br>
          ${info.architecture || "Unknown"}<br>
          ${info.device || "Unknown"}<br>
          ${info.description || "Unknown"}
        </div>
      `;

    }

    catch(e){

      html += `
        <div class="test info">
          GPU information unavailable,
          but the adapter works.
        </div>
      `;

    }


    /* Device */

    try{

      const device =
        await adapter.requestDevice();


      if(device){

        html += `
          <div class="test ok">
            ✅ GPU DEVICE CREATED
          </div>
        `;

        html += `
          <div class="test ok">
            🚀 WEBGPU IS WORKING
          </div>
        `;

        html += `
          <div class="test info">
            Your iPhone can expose a
            WebGPU device to this page.
          </div>
        `;

      }

    }

    catch(e){

      html += `
        <div class="test bad">
          ❌ GPU DEVICE FAILED
        </div>
      `;

      html += `
        <div class="test">
          ${e.message}
        </div>
      `;

    }

  }

  catch(e){

    html += `
      <div class="test bad">
        ❌ GPU TEST FAILED
      </div>
    `;

    html += `
      <div class="test">
        ${e.message}
      </div>
    `;

  }


  results.innerHTML =
    html;

}


test();

</script>

</body>
</html>
