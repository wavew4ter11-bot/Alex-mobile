<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0,
               viewport-fit=cover">

<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">

<title>A.L.E.X</title>

<style>

:root {
    --bg: #020606;
    --panel: #061010;
    --panel2: #081717;
    --green: #39ff14;
    --cyan: #19d9ff;
    --dim: #147a24;
    --white: #d9ffe0;
    --red: #ff3030;
    --border: rgba(57,255,20,.28);
}

* {
    box-sizing: border-box;
}

html,
body {
    margin: 0;
    width: 100%;
    height: 100%;
    background: var(--bg);
    color: var(--white);
    font-family: "Courier New", monospace;
    overflow: hidden;
}

button,
input {
    font-family: inherit;
}

button {
    cursor: pointer;
}

/* =========================================================
   APP
   ========================================================= */

#app {
    width: 100vw;
    height: 100vh;
    position: relative;
    overflow: hidden;
}

/* =========================================================
   HOME
   ========================================================= */

#home {
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    position: relative;
}

.header {
    height: 70px;
    min-height: 70px;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    border-bottom: 1px solid rgba(57,255,20,.12);
}

.logo {
    color: var(--green);
    font-size: 25px;
    font-weight: bold;
    letter-spacing: 5px;
    text-shadow:
        0 0 8px rgba(57,255,20,.8),
        0 0 22px rgba(57,255,20,.3);
}

.status {
    position: absolute;
    right: 18px;
    top: 26px;
    color: var(--dim);
    font-size: 10px;
    letter-spacing: 2px;
}

.status.active {
    color: var(--green);
}

/* =========================================================
   WAVE
   ========================================================= */

.wave-area {
    flex: 1;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
}

#wave {
    width: 94%;
    max-width: 900px;
    height: 260px;
}

.core {
    position: absolute;
    width: 7px;
    height: 7px;
    background: var(--cyan);
    border-radius: 50%;
    box-shadow:
        0 0 12px var(--cyan),
        0 0 30px rgba(25,217,255,.8);
}

/* =========================================================
   CHAT
   ========================================================= */

.chat-panel {
    position: absolute;
    left: 18px;
    right: 18px;
    bottom: 122px;
    max-width: 700px;
    margin: auto;
    height: 115px;

    background: rgba(3,12,12,.86);
    border: 1px solid var(--border);
    box-shadow:
        0 0 20px rgba(57,255,20,.05),
        inset 0 0 20px rgba(0,0,0,.5);

    padding: 12px;
    overflow-y: auto;
    font-size: 11px;
}

.chat-line {
    margin-bottom: 9px;
    line-height: 1.4;
}

.user {
    color: var(--cyan);
}

.alex {
    color: var(--green);
}

/* =========================================================
   INPUT
   ========================================================= */

.controls {
    position: absolute;
    left: 15px;
    right: 15px;
    bottom: 15px;
    height: 90px;

    display: flex;
    flex-direction: column;
    gap: 9px;
}

.input-row {
    display: flex;
    gap: 8px;
}

#textInput {
    flex: 1;
    height: 43px;

    background: #030909;
    border: 1px solid rgba(57,255,20,.35);
    color: var(--green);

    outline: none;
    padding: 0 13px;

    font-size: 12px;
}

#textInput:focus {
    border-color: var(--green);
    box-shadow: 0 0 10px rgba(57,255,20,.12);
}

.control-row {
    display: flex;
    justify-content: center;
    gap: 8px;
}

/* =========================================================
   BUTTONS
   ========================================================= */

.alex-button {
    background: #06100c;
    border: 1px solid rgba(57,255,20,.38);
    color: var(--green);

    height: 34px;
    padding: 0 17px;

    font-size: 10px;
    letter-spacing: 1px;

    transition:
        .15s ease;
}

.alex-button:hover {
    border-color: var(--green);
    box-shadow:
        0 0 12px rgba(57,255,20,.18);
}

.alex-button:active {
    transform: scale(.97);
}

.mic-button {
    color: var(--cyan);
    border-color: rgba(25,217,255,.4);
}

.mic-button.listening {
    color: #fff;
    border-color: var(--cyan);
    background: rgba(25,217,255,.12);
    box-shadow:
        0 0 18px rgba(25,217,255,.3);
}

.archive-button {
    color: var(--green);
}

/* =========================================================
   SCREENS
   ========================================================= */

.screen {
    position: absolute;
    inset: 0;
    background: var(--bg);
    display: none;
}

.screen.active {
    display: block;
}

/* =========================================================
   ARCHIVE
   LANDSCAPE
   ========================================================= */

#archiveScreen {
    overflow: hidden;
}

.archive-layout {
    width: 100%;
    height: 100%;
    display: grid;
    grid-template-columns: 40% 60%;
}

.archive-list {
    border-right: 1px solid rgba(57,255,20,.2);
    padding: 25px;

    overflow-y: auto;
}

.archive-title {
    color: var(--green);
    font-size: 17px;
    letter-spacing: 3px;
    margin-bottom: 20px;
}

.archive-subtitle {
    color: var(--dim);
    font-size: 9px;
    margin-bottom: 20px;
}

.suit-card {
    border: 1px solid rgba(57,255,20,.18);
    background: rgba(4,15,15,.7);

    padding: 12px;
    margin-bottom: 10px;

    display: flex;
    align-items: center;
    gap: 12px;

    transition: .15s ease;
}

.suit-card:hover {
    border-color: var(--green);
    background: rgba(57,255,20,.05);
}

.suit-card.selected {
    border-color: var(--cyan);
    box-shadow:
        0 0 12px rgba(25,217,255,.12);
}

.suit-thumb {
    width: 55px;
    height: 70px;
    object-fit: cover;

    background: #010404;
    border: 1px solid rgba(57,255,20,.18);
}

.suit-info {
    min-width: 0;
}

.suit-name {
    color: var(--green);
    font-size: 11px;
    margin-bottom: 6px;
}

.suit-era {
    color: var(--dim);
    font-size: 8px;
}

.archive-preview {
    position: relative;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;

    padding: 30px;
}

.preview-title {
    color: var(--cyan);
    font-size: 13px;
    letter-spacing: 2px;
    margin-bottom: 18px;
}

#selectedImage {
    max-width: 75%;
    max-height: 68%;

    object-fit: contain;

    border: 1px solid rgba(57,255,20,.25);

    box-shadow:
        0 0 25px rgba(57,255,20,.06);
}

.preview-name {
    color: var(--green);
    margin-top: 15px;
    font-size: 14px;
}

.preview-description {
    max-width: 650px;
    text-align: center;
    color: #83ad89;
    font-size: 9px;
    line-height: 1.5;
    margin-top: 8px;
}

.archive-controls {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;

    display: flex;
    justify-content: center;
    gap: 8px;
}

/* =========================================================
   ADD SUIT
   ========================================================= */

#suitFile {
    display: none;
}

/* =========================================================
   PORTRAIT SUIT VIEW
   ========================================================= */

#suitScreen {
    overflow: hidden;
}

.suit-view {
    width: 100%;
    height: 100%;

    display: flex;
    flex-direction: column;
}

.suit-header {
    height: 65px;
    min-height: 65px;

    display: flex;
    align-items: center;
    justify-content: center;

    border-bottom: 1px solid rgba(57,255,20,.12);
}

.suit-image-area {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px;
}

#suitLargeImage {
    max-width: 92%;
    max-height: 76%;

    object-fit: contain;

    box-shadow:
        0 0 30px rgba(57,255,20,.08);
}

.suit-details {
    text-align: center;
    padding: 5px 25px 95px;
}

#suitLargeName {
    color: var(--green);
    font-size: 15px;
    letter-spacing: 2px;
}

#suitLargeDescription {
    color: #83ad89;
    font-size: 9px;
    line-height: 1.5;
    margin-top: 8px;
}

.suit-bottom {
    position: absolute;
    bottom: 14px;
    left: 12px;
    right: 12px;

    display: flex;
    justify-content: center;
    gap: 7px;
}

/* =========================================================
   TOAST
   ========================================================= */

#toast {
    position: fixed;
    left: 50%;
    bottom: 110px;

    transform:
        translateX(-50%)
        translateY(20px);

    background: #061010;
    border: 1px solid var(--green);
    color: var(--green);

    padding: 10px 15px;

    font-size: 10px;

    opacity: 0;
    pointer-events: none;

    transition: .25s ease;
    z-index: 100;
}

#toast.show {
    opacity: 1;
    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================================================
   RESPONSIVE
   ========================================================= */

@media (orientation: portrait) {

    .status {
        font-size: 8px;
        right: 10px;
    }

    .logo {
        font-size: 20px;
    }

    .chat-panel {
        bottom: 128px;
        height: 100px;
    }

    #wave {
        height: 230px;
    }
}

@media (orientation: landscape) {

    #home {
        max-width: 900px;
        margin: auto;
    }

    .chat-panel {
        max-width: 750px;
    }
}

</style>
</head>

<body>

<div id="app">

    <!-- =====================================================
         HOME
         ===================================================== -->

    <section id="home">

        <div class="header">

            <div class="logo">
                A.L.E.X
            </div>

            <div
                id="status"
                class="status"
            >
                STANDBY
            </div>

        </div>

        <div class="wave-area">

            <canvas id="wave"></canvas>

            <div class="core"></div>

        </div>

        <div
            id="chat"
            class="chat-panel"
        >
        </div>

        <div class="controls">

            <div class="input-row">

                <input
                    id="textInput"
                    type="text"
                    autocomplete="off"
                    placeholder="ENTER COMMAND..."
                >

                <button
                    class="alex-button"
                    onclick="sendText()"
                >
                    SEND
                </button>

            </div>

            <div class="control-row">

                <button
                    class="alex-button mic-button"
                    id="micButton"
                    onclick="toggleMic()"
                >
                    MIC OFF
                </button>

                <button
                    class="alex-button archive-button"
                    onclick="openArchive()"
                >
                    ARCHIVES
                </button>

                <button
                    class="alex-button"
                    onclick="speakLast()"
                >
                    SPEAK
                </button>

            </div>

        </div>

    </section>


    <!-- =====================================================
         ARCHIVE
         ===================================================== -->

    <section
        id="archiveScreen"
        class="screen"
    >

        <div class="archive-layout">

            <div class="archive-list">

                <div class="archive-title">
                    A.L.E.X // ARCHIVE
                </div>

                <div class="archive-subtitle">
                    SPIDER-MAN SUIT DATABASE
                </div>

                <div id="suitList"></div>

            </div>


            <div class="archive-preview">

                <div class="preview-title">
                    SELECTED SUIT
                </div>

                <img
                    id="selectedImage"
                    alt="Selected suit"
                >

                <div
                    id="selectedName"
                    class="preview-name"
                >
                </div>

                <div
                    id="selectedDescription"
                    class="preview-description"
                >
                </div>

                <div class="archive-controls">

                    <button
                        class="alex-button"
                        onclick="previousSuit()"
                    >
                        &lt; PREVIOUS
                    </button>

                    <button
                        class="alex-button"
                        onclick="showSelectedSuit()"
                    >
                        OPEN
                    </button>

                    <button
                        class="alex-button"
                        onclick="nextSuit()"
                    >
                        NEXT &gt;
                    </button>

                    <button
                        class="alex-button"
                        onclick="document.getElementById('suitFile').click()"
                    >
                        ADD SUIT
                    </button>

                    <button
                        class="alex-button"
                        onclick="closeArchive()"
                    >
                        HOME
                    </button>

                </div>

            </div>

        </div>

        <input
            id="suitFile"
            type="file"
            accept="image/*"
            multiple
        >

    </section>


    <!-- =====================================================
         PORTRAIT SUIT VIEW
         ===================================================== -->

    <section
        id="suitScreen"
        class="screen"
    >

        <div class="suit-view">

            <div class="suit-header">

                <div class="logo">
                    A.L.E.X // SUIT
                </div>

            </div>

            <div class="suit-image-area">

                <img
                    id="suitLargeImage"
                    alt="Suit"
                >

            </div>

            <div class="suit-details">

                <div
                    id="suitLargeName"
                >
                </div>

                <div
                    id="suitLargeDescription"
                >
                </div>

            </div>

        </div>

        <div class="suit-bottom">

            <button
                class="alex-button"
                onclick="previousSuitFromView()"
            >
                &lt;
            </button>

            <button
                class="alex-button"
                onclick="openArchive()"
            >
                ARCHIVE
            </button>

            <button
                class="alex-button"
                onclick="closeSuitView()"
            >
                HOME
            </button>

            <button
                class="alex-button"
                onclick="nextSuitFromView()"
            >
                &gt;
            </button>

        </div>

    </section>

</div>

<div id="toast"></div>


<script>

/* =========================================================
   A.L.E.X
   ========================================================= */

const home =
    document.getElementById("home");

const archiveScreen =
    document.getElementById("archiveScreen");

const suitScreen =
    document.getElementById("suitScreen");

const chat =
    document.getElementById("chat");

const input =
    document.getElementById("textInput");

const status =
    document.getElementById("status");

const micButton =
    document.getElementById("micButton");

const wave =
    document.getElementById("wave");

const ctx =
    wave.getContext("2d");


/* =========================================================
   SUIT DATABASE
   ========================================================= */

let suits = [

    {
        name: "CLASSIC RED & BLUE",
        era: "CLASSIC",
        image:
            "https://images.unsplash.com/photo-1531259683007-016a7b628fc3?auto=format&fit=crop&w=800&q=80",
        description:
            "Classic red and blue Spider-Man-inspired suit concept."
    },

    {
        name: "BLACK SUIT",
        era: "BLACK SUIT",
        image:
            "https://images.unsplash.com/photo-1578662996442-48f60103fc96?auto=format&fit=crop&w=800&q=80",
        description:
            "Dark Spider-Man-inspired suit concept with a stealth-oriented appearance."
    },

    {
        name: "IRON SPIDER",
        era: "ADVANCED",
        image:
            "https://images.unsplash.com/photo-1594736797933-d0e501ba2fe6?auto=format&fit=crop&w=800&q=80",
        description:
            "Advanced metallic Spider-Man-inspired suit concept."
    }

];

let selectedIndex = 0;


/* =========================================================
   LOCAL STORAGE
   ========================================================= */

try {

    const saved =
        localStorage.getItem("alex_suits");

    if (saved) {

        const parsed =
            JSON.parse(saved);

        if (
            Array.isArray(parsed) &&
            parsed.length
        ) {

            suits = parsed;

        }

    }

} catch (error) {

    console.log(
        "Could not load saved archive.",
        error
    );

}


function saveSuits() {

    try {

        localStorage.setItem(
            "alex_suits",
            JSON.stringify(suits)
        );

    } catch (error) {

        console.log(
            "Could not save archive.",
            error
        );

    }

}


/* =========================================================
   CHAT
   ========================================================= */

function addChat(
    speaker,
    text
) {

    const line =
        document.createElement("div");

    line.className =
        "chat-line " +
        (
            speaker === "USER"
                ? "user"
                : "alex"
        );

    const now =
        new Date().toLocaleTimeString(
            [],
            {
                hour: "2-digit",
                minute: "2-digit",
                second: "2-digit"
            }
        );

    line.innerHTML =
        `<b>${speaker} // ${now}</b><br>` +
        escapeHTML(text);

    chat.appendChild(line);

    chat.scrollTop =
        chat.scrollHeight;

}


/* =========================================================
   TEXT COMMANDS
   ========================================================= */

function sendText() {

    const text =
        input.value.trim();

    if (!text) return;

    input.value = "";

    addChat(
        "USER",
        text
    );

    processCommand(text);

}


input.addEventListener(
    "keydown",
    function(event) {

        if (
            event.key === "Enter"
        ) {

            sendText();

        }

    }
);


/* =========================================================
   COMMAND ENGINE
   ========================================================= */

function processCommand(
    text
) {

    const low =
        text.toLowerCase();


    if (
        low.includes("archive") ||
        low.includes("archives") ||
        low.includes("suits")
    ) {

        openArchive();

        alex(
            "Opening the Spider-Man archive."
        );

        return;

    }


    if (
        low.includes("add suit")
    ) {

        document
            .getElementById("suitFile")
            .click();

        return;

    }


    if (
        low.includes("next suit")
    ) {

        nextSuit();

        return;

    }


    if (
        low.includes("previous suit")
    ) {

        previousSuit();

        return;

    }


    if (
        low.includes("close archive") ||
        low.includes("go home")
    ) {

        closeArchive();

        alex(
            "Returning home."
        );

        return;

    }


    for (
        let i = 0;
        i < suits.length;
        i++
    ) {

        const name =
            suits[i].name.toLowerCase();

        if (
            low.includes(name)
        ) {

            selectedIndex = i;

            showSelectedSuit();

            return;

        }

    }


    if (
        low.includes("hello") ||
        low.includes("hey") ||
        low.includes("hi alex")
    ) {

        alex(
            "Good to hear from you. Systems are standing by."
        );

        return;

    }


    if (
        low.includes("who are you")
    ) {

        alex(
            "I am A.L.E.X. Your personal browser-based assistant interface."
        );

        return;

    }


    if (
        low.includes("status")
    ) {

        alex(
            "A.L.E.X is online. Archive, voice input and interface systems are ready."
        );

        return;

    }


    alex(
        "I heard you. I can control the archive, open suits, navigate suits and respond to basic commands. This version does not require an external AI API."
    );

}


/* =========================================================
   ALEX RESPONSE
   ========================================================= */

let lastSpeech = "";

function alex(
    text
) {

    lastSpeech = text;

    addChat(
        "ALEX",
        text
    );

    setStatus(
        "RESPONDING"
    );

    setTimeout(
        () => setStatus("STANDBY"),
        900
    );

}


function setStatus(
    text
) {

    status.textContent =
        text;

    status.classList.toggle(
        "active",
        text !== "STANDBY"
    );

}


/* =========================================================
   SPEAK BUTTON
   ========================================================= */

function speakLast() {

    if (!lastSpeech) {

        alex(
            "There is nothing in my speech queue yet."
        );

        return;

    }

    if (
        !("speechSynthesis" in window)
    ) {

        alex(
            "Browser speech synthesis is not available."
        );

        return;

    }

    speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            lastSpeech
        );

    utterance.rate = 0.95;
    utterance.pitch = 1.0;
    utterance.volume = 1.0;

    speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   MICROPHONE
   ========================================================= */

let recognition = null;
let listening = false;

const SpeechRecognition =
    window.SpeechRecognition ||
    window.webkitSpeechRecognition;


if (SpeechRecognition) {

    recognition =
        new SpeechRecognition();

    recognition.continuous = false;
    recognition.interimResults = false;

    recognition.lang = "en-GB";

    recognition.onstart =
        function() {

            listening = true;

            micButton.textContent =
                "MIC ON";

            micButton.classList.add(
                "listening"
            );

            setStatus(
                "LISTENING"
            );

        };


    recognition.onresult =
        function(event) {

            const text =
                event.results[0][0].transcript;

            input.value = text;

            addChat(
                "USER",
                text
            );

            processCommand(text);

        };


    recognition.onerror =
        function(event) {

            console.log(
                "Speech recognition error:",
                event.error
            );

            if (
                event.error ===
                "not-allowed"
            ) {

                alex(
                    "Microphone permission was denied. Allow microphone access in your browser settings and try again."
                );

            }

        };


    recognition.onend =
        function() {

            listening = false;

            micButton.textContent =
                "MIC OFF";

            micButton.classList.remove(
                "listening"
            );

            setStatus(
                "STANDBY"
            );

        };

}


function toggleMic() {

    if (!recognition) {

        alex(
            "Your browser does not support built-in speech recognition. Try Microsoft Edge or Google Chrome."
        );

        return;

    }


    if (listening) {

        recognition.stop();

        return;

    }


    try {

        recognition.start();

    } catch (error) {

        console.log(error);

    }

}


/* =========================================================
   ARCHIVE
   ========================================================= */

function openArchive() {

    home.style.display =
        "none";

    suitScreen.classList.remove(
        "active"
    );

    archiveScreen.classList.add(
        "active"
    );

    renderArchive();

}


function closeArchive() {

    archiveScreen.classList.remove(
        "active"
    );

    suitScreen.classList.remove(
        "active"
    );

    home.style.display =
        "flex";

}


/* =========================================================
   RENDER ARCHIVE
   ========================================================= */

function renderArchive() {

    const list =
        document.getElementById(
            "suitList"
        );

    list.innerHTML = "";

    suits.forEach(
        (suit, index) => {

            const card =
                document.createElement(
                    "div"
                );

            card.className =
                "suit-card" +
                (
                    index === selectedIndex
                        ? " selected"
                        : ""
                );

            card.onclick =
                function() {

                    selectedIndex =
                        index;

                    renderArchive();

                };


            card.innerHTML =

                `<img
                    class="suit-thumb"
                    src="${escapeAttribute(suit.image)}"
                    alt=""
                >

                <div class="suit-info">

                    <div class="suit-name">
                        ${escapeHTML(suit.name)}
                    </div>

                    <div class="suit-era">
                        ${escapeHTML(suit.era)}
                    </div>

                </div>`;


            list.appendChild(
                card
            );

        }
    );


    if (suits.length) {

        const suit =
            suits[selectedIndex];

        document
            .getElementById(
                "selectedImage"
            )
            .src =
            suit.image;

        document
            .getElementById(
                "selectedName"
            )
            .textContent =
            suit.name;

        document
            .getElementById(
                "selectedDescription"
            )
            .textContent =
            suit.description;

    }

}


/* =========================================================
   SUIT NAVIGATION
   ========================================================= */

function nextSuit() {

    if (!suits.length)
        return;

    selectedIndex =
        (
            selectedIndex + 1
        ) % suits.length;

    renderArchive();

}


function previousSuit() {

    if (!suits.length)
        return;

    selectedIndex =
        (
            selectedIndex - 1 +
            suits.length
        ) % suits.length;

    renderArchive();

}


/* =========================================================
   OPEN SELECTED SUIT
   ========================================================= */

function showSelectedSuit() {

    if (!suits.length)
        return;

    const suit =
        suits[selectedIndex];

    document
        .getElementById(
            "suitLargeImage"
        )
        .src =
        suit.image;

    document
        .getElementById(
            "suitLargeName"
        )
        .textContent =
        suit.name;

    document
        .getElementById(
            "suitLargeDescription"
        )
        .textContent =
        suit.description;

    archiveScreen.classList.remove(
        "active"
    );

    suitScreen.classList.add(
        "active"
    );

}


function closeSuitView() {

    suitScreen.classList.remove(
        "active"
    );

    home.style.display =
        "flex";

}


function previousSuitFromView() {

    previousSuit();

    showSelectedSuit();

}


function nextSuitFromView() {

    nextSuit();

    showSelectedSuit();

}


/* =========================================================
   ADD SUITS
   ========================================================= */

document
    .getElementById("suitFile")
    .addEventListener(
        "change",
        function(event) {

            const files =
                Array.from(
                    event.target.files
                );

            if (!files.length)
                return;

            files.forEach(
                file => {

                    const reader =
                        new FileReader();

                    reader.onload =
                        function(e) {

                            const name =
                                file.name
                                    .replace(
                                        /\.[^/.]+$/,
                                        ""
                                    )
                                    .replace(
                                        /[_-]/g,
                                        " "
                                    )
                                    .toUpperCase();

                            suits.push({

                                name:
                                    name ||
                                    "CUSTOM SUIT",

                                era:
                                    "CUSTOM",

                                image:
                                    e.target.result,

                                description:
                                    "Custom suit image added to the A.L.E.X archive."

                            });

                            selectedIndex =
                                suits.length - 1;

                            saveSuits();

                            renderArchive();

                            toast(
                                "SUIT ADDED TO ARCHIVE"
                            );

                        };

                    reader.readAsDataURL(
                        file
                    );

                }
            );

            event.target.value = "";

        }
    );


/* =========================================================
   WAVEFORM
   ========================================================= */

function resizeWave() {

    const rect =
        wave.getBoundingClientRect();

    wave.width =
        rect.width *
        window.devicePixelRatio;

    wave.height =
        rect.height *
        window.devicePixelRatio;

    ctx.scale(
        window.devicePixelRatio,
        window.devicePixelRatio
    );

}


let waveTime = 0;


function drawWave() {

    const width =
        wave.clientWidth;

    const height =
        wave.clientHeight;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );


    waveTime +=
        listening
            ? 0.09
            : 0.045;


    const bars = 65;

    const center =
        height / 2;


    for (
        let i = 0;
        i < bars;
        i++
    ) {

        const x =
            (
                i /
                (bars - 1)
            ) * width;


        const distance =
            Math.abs(
                i -
                (bars - 1) / 2
            );


        const envelope =
            Math.max(
                0,
                1 -
                distance /
                (bars * .58)
            );


        const wave1 =
            Math.sin(
                i * .28 +
                waveTime
            );


        const wave2 =
            Math.sin(
                i * .11 -
                waveTime * 1.7
            );


        const movement =
            (
                Math.abs(wave1) * .7 +
                Math.abs(wave2) * .3
            );


        const listeningBoost =
            listening
                ? 1.8
                : 1;


        const barHeight =
            8 +
            movement *
            80 *
            envelope *
            listeningBoost;


        ctx.beginPath();

        ctx.moveTo(
            x,
            center - barHeight
        );

        ctx.lineTo(
            x,
            center + barHeight
        );

        ctx.strokeStyle =
            i % 2
                ? "#39ff14"
                : "#19d9ff";

        ctx.lineWidth = 2;

        ctx.shadowBlur = 8;

        ctx.shadowColor =
            i % 2
                ? "#39ff14"
                : "#19d9ff";

        ctx.stroke();

    }


    ctx.shadowBlur = 0;

    requestAnimationFrame(
        drawWave
    );

}


window.addEventListener(
    "resize",
    resizeWave
);


/* =========================================================
   TOAST
   ========================================================= */

let toastTimer = null;


function toast(
    text
) {

    const element =
        document.getElementById(
            "toast"
        );

    element.textContent =
        text;

    element.classList.add(
        "show"
    );

    clearTimeout(
        toastTimer
    );

    toastTimer =
        setTimeout(
            () => {

                element.classList.remove(
                    "show"
                );

            },
            1800
        );

}


/* =========================================================
   ESCAPE HTML
   ========================================================= */

function escapeHTML(
    text
) {

    return String(text)
        .replace(
            /&/g,
            "&amp;"
        )
        .replace(
            /</g,
            "&lt;"
        )
        .replace(
            />/g,
            "&gt;"
        )
        .replace(
            /"/g,
            "&quot;"
        )
        .replace(
            /'/g,
            "&#039;"
        );

}


function escapeAttribute(
    text
) {

    return escapeHTML(text);

}


/* =========================================================
   START
   ========================================================= */

resizeWave();

drawWave();

addChat(
    "ALEX",
    "Systems online. A.L.E.X is standing by."
);
