<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>A.L.E.X</title>

<style>

:root {
    --bg: #030706;
    --panel: #07100d;
    --panel2: #0a1511;

    --green: #39ff14;
    --green2: #8cff68;
    --dim: #126b20;

    --cyan: #19d9ff;
    --white: #eaffea;

    --border: rgba(57,255,20,.35);
    --glow: rgba(57,255,20,.18);

    --font: "Courier New", Consolas, monospace;
}

* {
    box-sizing: border-box;
}

html,
body {
    width: 100%;
    height: 100%;
    margin: 0;
    overflow: hidden;

    background: var(--bg);
    color: var(--green);

    font-family: var(--font);
}

/* =========================================================
   MAIN APP
========================================================= */

#app {
    width: 100vw;
    height: 100vh;

    position: relative;
    overflow: hidden;

    background:
        radial-gradient(
            circle at 50% 42%,
            rgba(20,100,40,.09),
            transparent 42%
        ),
        #030706;
}

/* =========================================================
   PORTRAIT HOME
========================================================= */

#home {
    position: absolute;
    inset: 0;

    display: flex;
    flex-direction: column;
    align-items: center;

    padding:
        max(20px, env(safe-area-inset-top))
        18px
        max(20px, env(safe-area-inset-bottom));

    transition: .25s ease;
}

#home.hidden {
    display: none;
}

.logo {
    margin-top: 12px;

    font-size: 25px;
    font-weight: bold;
    letter-spacing: 7px;

    color: var(--green);

    text-shadow:
        0 0 7px var(--green),
        0 0 20px rgba(57,255,20,.5);
}

.subtitle {
    margin-top: 4px;

    font-size: 9px;
    letter-spacing: 4px;

    color: #197f2a;
}

/* =========================================================
   PORTRAIT STATUS
========================================================= */

.status {
    margin-top: 28px;

    font-size: 10px;
    letter-spacing: 3px;

    color: var(--green2);
}

.status::before {
    content: "●";
    margin-right: 8px;

    color: var(--green);

    text-shadow: 0 0 8px var(--green);
}

/* =========================================================
   WAVE
========================================================= */

.wave-area {
    position: relative;

    width: min(92vw, 480px);
    height: 250px;

    margin-top: 15px;

    display: flex;
    align-items: center;
    justify-content: center;
}

#wave {
    width: 100%;
    height: 100%;
}

/* =========================================================
   CHAT
========================================================= */

#chat {
    width: min(92vw, 520px);

    flex: 1;

    min-height: 100px;
    max-height: 38vh;

    overflow-y: auto;

    padding: 8px 6px;

    font-size: 11px;
    line-height: 1.65;

    scrollbar-width: thin;
    scrollbar-color: var(--dim) transparent;
}

.chat-line {
    margin-bottom: 10px;
}

.chat-user {
    color: var(--cyan);
}

.chat-alex {
    color: var(--green2);
}

.chat-time {
    color: #397744;
    font-size: 8px;
}

/* =========================================================
   HOME INPUT
========================================================= */

.home-controls {
    width: min(92vw, 520px);

    display: flex;
    gap: 8px;

    margin-top: 10px;
}

#textInput {
    flex: 1;

    min-width: 0;

    background: var(--panel);

    border: 1px solid var(--border);
    border-radius: 5px;

    color: var(--white);

    padding: 13px;

    outline: none;

    font-family: var(--font);
    font-size: 11px;

    box-shadow:
        inset 0 0 15px rgba(0,0,0,.3);
}

#textInput:focus {
    border-color: var(--green);

    box-shadow:
        0 0 10px var(--glow);
}

button {
    border: 1px solid var(--border);

    background:
        linear-gradient(
            180deg,
            #0a1910,
            #050b08
        );

    color: var(--green);

    font-family: var(--font);
    font-size: 10px;

    letter-spacing: 1px;

    padding: 11px 14px;

    border-radius: 4px;

    cursor: pointer;

    transition: .15s ease;
}

button:hover {
    border-color: var(--green);

    color: white;

    box-shadow:
        0 0 12px var(--glow);
}

button:active {
    transform: scale(.97);
}

/* =========================================================
   BOTTOM BUTTONS
========================================================= */

.home-buttons {
    width: min(92vw, 520px);

    display: flex;

    gap: 8px;

    margin-top: 9px;
}

.home-buttons button {
    flex: 1;
}

.mic-active {
    border-color: var(--cyan) !important;
    color: var(--cyan) !important;

    box-shadow:
        0 0 15px rgba(25,217,255,.25);
}

/* =========================================================
   ARCHIVE OVERLAY
========================================================= */

#archive {
    position: absolute;
    inset: 0;

    display: none;

    background:
        radial-gradient(
            circle at 50% 40%,
            rgba(30,100,40,.08),
            transparent 55%
        ),
        #020605;
}

#archive.visible {
    display: flex;
    flex-direction: column;
}

/* =========================================================
   ARCHIVE TOP BAR
========================================================= */

.archive-top {
    width: 100%;

    min-height: 72px;

    display: flex;
    align-items: center;

    gap: 10px;

    padding:
        max(10px, env(safe-area-inset-top))
        16px
        10px;

    border-bottom: 1px solid var(--border);

    background:
        linear-gradient(
            180deg,
            rgba(7,20,13,.98),
            rgba(3,9,6,.98)
        );

    flex-shrink: 0;
}

.archive-title {
    margin-right: auto;

    min-width: 150px;
}

.archive-title-main {
    font-size: 15px;
    font-weight: bold;

    letter-spacing: 3px;

    text-shadow:
        0 0 8px rgba(57,255,20,.4);
}

.archive-title-sub {
    margin-top: 4px;

    color: #297e36;

    font-size: 8px;
    letter-spacing: 2px;
}

.archive-toolbar {
    display: flex;
    gap: 7px;
    flex-wrap: wrap;
    justify-content: flex-end;
}

.archive-toolbar button {
    white-space: nowrap;
}

/* =========================================================
   LANDSCAPE ARCHIVE BODY
========================================================= */

.archive-body {
    flex: 1;

    min-height: 0;

    display: grid;

    grid-template-columns:
        minmax(240px, 32%)
        minmax(0, 68%);

    gap: 0;
}

/* =========================================================
   SUIT LIST
========================================================= */

.suit-list {
    min-width: 0;
    min-height: 0;

    overflow-y: auto;

    border-right: 1px solid var(--border);

    padding: 14px;

    scrollbar-width: thin;
    scrollbar-color: var(--dim) transparent;
}

.list-heading {
    font-size: 9px;
    letter-spacing: 2px;

    color: #34843f;

    margin-bottom: 12px;
}

#suitListItems {
    display: flex;
    flex-direction: column;

    gap: 8px;
}

.suit-card {
    display: grid;

    grid-template-columns: 68px 1fr;

    gap: 10px;

    min-height: 74px;

    padding: 7px;

    border: 1px solid rgba(57,255,20,.18);

    background: rgba(5,15,10,.7);

    border-radius: 4px;

    cursor: pointer;

    transition: .15s ease;
}

.suit-card:hover {
    border-color: var(--green);

    background: rgba(20,50,25,.35);
}

.suit-card.selected {
    border-color: var(--green);

    box-shadow:
        inset 3px 0 0 var(--green),
        0 0 12px rgba(57,255,20,.08);
}

.suit-thumb {
    width: 68px;
    height: 58px;

    object-fit: cover;

    background: #020504;

    border: 1px solid rgba(57,255,20,.15);
}

.suit-card-name {
    color: var(--green2);

    font-size: 10px;
    font-weight: bold;

    margin-top: 5px;
}

.suit-card-meta {
    color: #447c4b;

    font-size: 8px;

    margin-top: 6px;
}

/* =========================================================
   EMPTY ARCHIVE
========================================================= */

.empty-archive {
    padding: 35px 20px;

    text-align: center;

    color: #397344;

    font-size: 10px;
    line-height: 1.8;
}

.empty-icon {
    font-size: 32px;

    margin-bottom: 12px;

    color: #195d26;
}

/* =========================================================
   SUIT VIEWER
========================================================= */

.suit-viewer {
    min-width: 0;
    min-height: 0;

    display: grid;

    grid-template-columns:
        minmax(280px, 55%)
        minmax(230px, 45%);

    gap: 0;
}

/* =========================================================
   IMAGE PANEL
========================================================= */

.image-panel {
    min-width: 0;
    min-height: 0;

    position: relative;

    display: flex;
    align-items: center;
    justify-content: center;

    padding: 25px;

    background:
        radial-gradient(
            ellipse at center,
            rgba(30,80,40,.10),
            transparent 65%
        );
}

#selectedImage {
    max-width: 100%;
    max-height: 100%;

    object-fit: contain;

    display: none;

    border: 1px solid rgba(57,255,20,.15);

    box-shadow:
        0 0 25px rgba(57,255,20,.05);
}

.image-placeholder {
    text-align: center;

    color: #2b6734;

    font-size: 10px;
    letter-spacing: 2px;
}

/* =========================================================
   IMAGE NAV
========================================================= */

.image-nav {
    position: absolute;

    left: 50%;
    bottom: 18px;

    transform: translateX(-50%);

    display: flex;

    gap: 8px;
}

/* =========================================================
   DETAILS
========================================================= */

.suit-details {
    min-width: 0;
    min-height: 0;

    overflow-y: auto;

    padding: 30px 30px 80px;

    border-left: 1px solid rgba(57,255,20,.15);
}

.detail-label {
    color: #3b8745;

    font-size: 8px;
    letter-spacing: 2px;

    margin-bottom: 7px;
}

#detailName {
    color: var(--green);

    font-size: 22px;
    font-weight: bold;

    letter-spacing: 2px;

    margin-bottom: 22px;
}

#detailDescription {
    color: var(--white);

    font-size: 11px;

    line-height: 1.8;

    white-space: pre-wrap;
}

.detail-section {
    margin-top: 25px;

    padding-top: 15px;

    border-top: 1px solid rgba(57,255,20,.12);
}

/* =========================================================
   ADD SUIT MODAL
========================================================= */

.modal {
    position: fixed;
    inset: 0;

    display: none;

    align-items: center;
    justify-content: center;

    z-index: 100;

    background: rgba(0,0,0,.75);
}

.modal.visible {
    display: flex;
}

.modal-box {
    width: min(92vw, 500px);

    max-height: 90vh;

    overflow-y: auto;

    padding: 24px;

    background: #06100b;

    border: 1px solid var(--green);

    box-shadow:
        0 0 30px rgba(57,255,20,.12);
}

.modal-title {
    font-size: 15px;
    letter-spacing: 3px;

    margin-bottom: 20px;
}

.form-label {
    display: block;

    color: #47874f;

    font-size: 8px;
    letter-spacing: 2px;

    margin: 14px 0 6px;
}

.form-input,
.form-textarea {
    width: 100%;

    background: #020604;

    color: var(--white);

    border: 1px solid rgba(57,255,20,.3);

    padding: 11px;

    outline: none;

    font-family: var(--font);
    font-size: 10px;
}

.form-textarea {
    min-height: 100px;
    resize: vertical;
}

.file-input {
    width: 100%;

    color: #8bb98e;

    font-family: var(--font);
    font-size: 9px;
}

.modal-buttons {
    display: flex;

    gap: 8px;

    margin-top: 20px;
}

.modal-buttons button {
    flex: 1;
}

/* =========================================================
   TOAST
========================================================= */

#toast {
    position: fixed;

    left: 50%;
    bottom: 25px;

    transform:
        translateX(-50%)
        translateY(20px);

    opacity: 0;

    pointer-events: none;

    background: #06130b;

    border: 1px solid var(--green);

    color: var(--green2);

    padding: 10px 18px;

    font-family: var(--font);
    font-size: 9px;

    z-index: 200;

    transition: .25s ease;
}

#toast.show {
    opacity: 1;

    transform:
        translateX(-50%)
        translateY(0);
}

/* =========================================================
   MOBILE ARCHIVE
========================================================= */

@media (max-width: 700px) {

    .archive-top {
        min-height: 110px;

        align-items: flex-start;
    }

    .archive-title {
        padding-top: 5px;
    }

    .archive-toolbar {
        max-width: 65%;
    }

    .archive-toolbar button {
        padding: 8px 9px;
        font-size: 8px;
    }

    .archive-body {
        grid-template-columns: 115px 1fr;
    }

    .suit-card {
        display: block;
    }

    .suit-thumb {
        width: 100%;
        height: 70px;
    }

    .suit-card-name {
        font-size: 8px;
    }

    .suit-card-meta {
        display: none;
    }

    .suit-viewer {
        grid-template-columns: 1fr;
        grid-template-rows: 55% 45%;
    }

    .suit-details {
        border-left: none;
        border-top: 1px solid rgba(57,255,20,.15);

        padding: 15px 18px 60px;
    }

    #detailName {
        font-size: 16px;
        margin-bottom: 10px;
    }

    #detailDescription {
        font-size: 9px;
    }
}

/* =========================================================
   LANDSCAPE SMALL SCREENS
========================================================= */

@media (orientation: landscape) and (max-height: 650px) {

    #home {
        padding-top: 8px;
    }

    .logo {
        margin-top: 3px;
    }

    .status {
        margin-top: 8px;
    }

    .wave-area {
        height: 150px;
        margin-top: 2px;
    }

    #chat {
        max-height: 22vh;
    }
}

</style>
</head>

<body>

<div id="app">

<!-- =====================================================
     HOME
===================================================== -->

<section id="home">

    <div class="logo">
        A.L.E.X
    </div>

    <div class="subtitle">
        ADVANCED LOGIC &amp; EXPLORATION SYSTEM
    </div>

    <div id="status" class="status">
        STANDBY
    </div>

    <div class="wave-area">
        <canvas id="wave"></canvas>
    </div>

    <div id="chat"></div>

    <div class="home-controls">

        <input
            id="textInput"
            type="text"
            autocomplete="off"
            placeholder="Speak to A.L.E.X..."
        >

        <button id="sendButton">
            SEND
        </button>

    </div>

    <div class="home-buttons">

        <button id="micButton">
            MIC OFF
        </button>

        <button id="speakButton">
            SPEAK
        </button>

        <button id="archiveButton">
            ARCHIVES
        </button>

    </div>

</section>


<!-- =====================================================
     ARCHIVE
===================================================== -->

<section id="archive">

    <div class="archive-top">

        <div class="archive-title">

            <div class="archive-title-main">
                A.L.E.X // ARCHIVE
            </div>

            <div class="archive-title-sub">
                SUIT DATABASE
            </div>

        </div>

        <div class="archive-toolbar">

            <button id="addSuitButton">
                + ADD SUIT
            </button>

            <button id="deleteSuitButton">
                DELETE
            </button>

            <button id="backButton">
                &lt; HOME
            </button>

        </div>

    </div>


    <div class="archive-body">

        <!-- SUIT LIST -->

        <div class="suit-list">

            <div class="list-heading">
                ARCHIVED SUITS
            </div>

            <div id="suitListItems"></div>

        </div>


        <!-- VIEWER -->

        <div class="suit-viewer">

            <div class="image-panel">

                <div
                    id="imagePlaceholder"
                    class="image-placeholder"
                >
                    SELECT A SUIT
                </div>

                <img
                    id="selectedImage"
                    alt="Selected suit"
                >

                <div class="image-nav">

                    <button id="previousImage">
                        &lt;
                    </button>

                    <button id="nextImage">
                        &gt;
                    </button>

                </div>

            </div>


            <div class="suit-details">

                <div class="detail-label">
                    CURRENT ARCHIVE ENTRY
                </div>

                <div id="detailName">
                    NO SUIT SELECTED
                </div>

                <div class="detail-section">

                    <div class="detail-label">
                        DESCRIPTION
                    </div>

                    <div id="detailDescription">
                        Add a suit to begin building the archive.
                    </div>

                </div>

                <div class="detail-section">

                    <div class="detail-label">
                        IMAGE COUNT
                    </div>

                    <div id="detailImageCount">
                        0
                    </div>

                </div>

            </div>

        </div>

    </div>

</section>


<!-- =====================================================
     ADD SUIT MODAL
===================================================== -->

<div id="addModal" class="modal">

    <div class="modal-box">

        <div class="modal-title">
            ADD SUIT TO ARCHIVE
        </div>

        <label class="form-label">
            SUIT NAME
        </label>

        <input
            id="suitName"
            class="form-input"
            placeholder="e.g. INTEGRATED SUIT"
        >

        <label class="form-label">
            DESCRIPTION
        </label>

        <textarea
            id="suitDescription"
            class="form-textarea"
            placeholder="Leave blank for automatic description."
        ></textarea>

        <label class="form-label">
            SUIT IMAGES
        </label>

        <input
            id="suitImages"
            class="file-input"
            type="file"
            accept="image/*"
            multiple
        >

        <div class="modal-buttons">

            <button id="saveSuitButton">
                SAVE SUIT
            </button>

            <button id="cancelSuitButton">
                CANCEL
            </button>

        </div>

    </div>

</div>


<div id="toast"></div>

</div>


<script>

/* =========================================================
   A.L.E.X
   LOCAL ARCHIVE SYSTEM
========================================================= */

const STORAGE_KEY = "alex_suit_archive_v2";

let suits = [];
let selectedSuit = -1;
let selectedImageIndex = 0;

let micActive = false;
let recognition = null;

let speechEnabled = true;


/* =========================================================
   ELEMENTS
========================================================= */

const home = document.getElementById("home");
const archive = document.getElementById("archive");

const chat = document.getElementById("chat");

const textInput = document.getElementById("textInput");
const sendButton = document.getElementById("sendButton");

const micButton = document.getElementById("micButton");
const speakButton = document.getElementById("speakButton");

const archiveButton = document.getElementById("archiveButton");

const backButton = document.getElementById("backButton");

const addSuitButton =
    document.getElementById("addSuitButton");

const deleteSuitButton =
    document.getElementById("deleteSuitButton");

const suitListItems =
    document.getElementById("suitListItems");

const selectedImage =
    document.getElementById("selectedImage");

const imagePlaceholder =
    document.getElementById("imagePlaceholder");

const detailName =
    document.getElementById("detailName");

const detailDescription =
    document.getElementById("detailDescription");

const detailImageCount =
    document.getElementById("detailImageCount");

const previousImage =
    document.getElementById("previousImage");

const nextImage =
    document.getElementById("nextImage");

const addModal =
    document.getElementById("addModal");

const suitName =
    document.getElementById("suitName");

const suitDescription =
    document.getElementById("suitDescription");

const suitImages =
    document.getElementById("suitImages");

const saveSuitButton =
    document.getElementById("saveSuitButton");

const cancelSuitButton =
    document.getElementById("cancelSuitButton");

const status =
    document.getElementById("status");

const toast =
    document.getElementById("toast");


/* =========================================================
   LOAD ARCHIVE
========================================================= */

function loadArchive() {

    try {

        const saved =
            localStorage.getItem(STORAGE_KEY);

        if (!saved) {

            suits = [];

            return;
        }

        const parsed =
            JSON.parse(saved);

        if (Array.isArray(parsed)) {

            suits = parsed;

        } else {

            suits = [];
        }

    } catch (error) {

        console.error(error);

        suits = [];
    }
}


/* =========================================================
   SAVE ARCHIVE
========================================================= */

function saveArchive() {

    try {

        localStorage.setItem(
            STORAGE_KEY,
            JSON.stringify(suits)
        );

    } catch (error) {

        console.error(error);

        showToast(
            "Could not save archive."
        );
    }
}


/* =========================================================
   TOAST
========================================================= */

let toastTimer = null;

function showToast(text) {

    toast.textContent = text;

    toast.classList.add("show");

    clearTimeout(toastTimer);

    toastTimer = setTimeout(
        () => {
            toast.classList.remove("show");
        },
        2400
    );
}


/* =========================================================
   TIME
========================================================= */

function currentTime() {

    return new Date().toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit"
        }
    );
}


/* =========================================================
   CHAT
========================================================= */

function addChat(
    speaker,
    text
) {

    const wrapper =
        document.createElement("div");

    wrapper.className =
        "chat-line";

    const time =
        document.createElement("div");

    time.className =
        "chat-time";

    time.textContent =
        speaker +
        " // " +
        currentTime();

    const message =
        document.createElement("div");

    message.className =
        speaker === "USER"
            ? "chat-user"
            : "chat-alex";

    message.textContent =
        text;

    wrapper.appendChild(time);
    wrapper.appendChild(message);

    chat.appendChild(wrapper);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================================
   LOCAL ALEX
========================================================= */

function alexResponse(text) {

    const low =
        text.toLowerCase();

    if (
        low.includes("archive") ||
        low.includes("suits")
    ) {

        openArchive();

        return;
    }

    if (
        low.includes("hello") ||
        low.includes("hi alex")
    ) {

        return "A.L.E.X online. Systems standing by.";

    }

    if (
        low.includes("mic")
    ) {

        return micActive
            ? "Microphone is currently active."
            : "Microphone is currently inactive.";

    }

    if (
        low.includes("status")
    ) {

        return "All local interface systems are operational.";

    }

    return (
        "I’m running in local interface mode. " +
        "I can control the archive, microphone, " +
        "speech and workspace interface."
    );
}


/* =========================================================
   SEND
========================================================= */

function sendMessage() {

    const text =
        textInput.value.trim();

    if (!text)
        return;

    textInput.value = "";

    addChat(
        "USER",
        text
    );

    status.textContent =
        "THINKING";

    setTimeout(
        () => {

            const answer =
                alexResponse(text);

            if (answer) {

                addChat(
                    "ALEX",
                    answer
                );

                if (speechEnabled) {

                    speakText(answer);
                }
            }

            status.textContent =
                "STANDBY";

        },
        250
    );
}


sendButton.addEventListener(
    "click",
    sendMessage
);

textInput.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
        ) {

            sendMessage();
        }
    }
);


/* =========================================================
   ARCHIVE NAVIGATION
========================================================= */

function openArchive() {

    home.classList.add("hidden");

    archive.classList.add("visible");

    renderArchive();
}

function closeArchive() {

    archive.classList.remove(
        "visible"
    );

    home.classList.remove(
        "hidden"
    );

    status.textContent =
        "STANDBY";
}

archiveButton.addEventListener(
    "click",
    openArchive
);

backButton.addEventListener(
    "click",
    closeArchive
);


/* =========================================================
   AUTOMATIC DESCRIPTION
========================================================= */

function generateDescription(
    name
) {

    const upper =
        name.toUpperCase();

    const lower =
        name.toLowerCase();

    let style =
        "advanced Spider-Man suit";

    if (
        lower.includes("iron") ||
        lower.includes("tech")
    ) {

        style =
            "technology-focused Spider-Man suit";

    } else if (
        lower.includes("stealth") ||
        lower.includes("black")
    ) {

        style =
            "stealth-oriented Spider-Man suit";

    } else if (
        lower.includes("classic") ||
        lower.includes("red")
    ) {

        style =
            "classic red-and-blue Spider-Man suit";

    } else if (
        lower.includes("symbiote")
    ) {

        style =
            "dark symbiote-inspired Spider-Man suit";
    }

    return (
        `${upper} is an ${style} concept. ` +
        `The design combines a distinctive visual identity ` +
        `with a practical superhero aesthetic. ` +
        `Its appearance, materials and technology can be ` +
        `expanded as additional archive information is added. ` +
        `A.L.E.X has automatically generated this description ` +
        `from the suit's archive name.`
    );
}


/* =========================================================
   ADD SUIT MODAL
========================================================= */

function openAddModal() {

    suitName.value = "";
    suitDescription.value = "";
    suitImages.value = "";

    addModal.classList.add(
        "visible"
    );

    setTimeout(
        () => suitName.focus(),
        50
    );
}

function closeAddModal() {

    addModal.classList.remove(
        "visible"
    );
}

addSuitButton.addEventListener(
    "click",
    openAddModal
);

cancelSuitButton.addEventListener(
    "click",
    closeAddModal
);


/* =========================================================
   FILE -> DATA URL
========================================================= */

function fileToDataURL(file) {

    return new Promise(
        (resolve, reject) => {

            const reader =
                new FileReader();

            reader.onload =
                () => resolve(
                    reader.result
                );

            reader.onerror =
                reject;

            reader.readAsDataURL(
                file
            );
        }
    );
}


/* =========================================================
   SAVE NEW SUIT
========================================================= */

saveSuitButton.addEventListener(
    "click",
    async () => {

        const name =
            suitName.value.trim();

        if (!name) {

            showToast(
                "Enter a suit name."
            );

            return;
        }

        const files =
            Array.from(
                suitImages.files
            );

        const images = [];

        try {

            for (
                const file of files
            ) {

                images.push(
                    await fileToDataURL(
                        file
                    )
                );
            }

        } catch (error) {

            showToast(
                "Could not load an image."
            );

            return;
        }

        const description =
            suitDescription.value.trim()
                ||
            generateDescription(
                name
            );

        const newSuit = {

            id:
                Date.now(),

            name:
                name.toUpperCase(),

            description:
                description,

            images:
                images,

            created:
                new Date().toISOString()
        };

        suits.push(
            newSuit
        );

        saveArchive();

        selectedSuit =
            suits.length - 1;

        selectedImageIndex = 0;

        closeAddModal();

        renderArchive();

        showToast(
            `${name.toUpperCase()} added to archive.`
        );
    }
);


/* =========================================================
   DELETE SUIT
========================================================= */

deleteSuitButton.addEventListener(
    "click",
    () => {

        if (
            selectedSuit < 0 ||
            !suits[selectedSuit]
        ) {

            showToast(
                "Select a suit first."
            );

            return;
        }

        const name =
            suits[selectedSuit].name;

        const confirmed =
            confirm(
                `Delete ${name} from the archive?`
            );

        if (!confirmed)
            return;

        suits.splice(
            selectedSuit,
            1
        );

        if (
            suits.length === 0
        ) {

            selectedSuit = -1;

        } else {

            selectedSuit =
                Math.min(
                    selectedSuit,
                    suits.length - 1
                );
        }

        selectedImageIndex = 0;

        saveArchive();

        renderArchive();

        showToast(
            `${name} deleted.`
        );
    }
);


/* =========================================================
   RENDER ARCHIVE
========================================================= */

function renderArchive() {

    renderSuitList();

    renderSelectedSuit();
}


/* =========================================================
   SUIT LIST
========================================================= */

function renderSuitList() {

    suitListItems.innerHTML = "";

    if (
        suits.length === 0
    ) {

        const empty =
            document.createElement("div");

        empty.className =
            "empty-archive";

        empty.innerHTML =
            `
                <div class="empty-icon">◇</div>
                ARCHIVE EMPTY
                <br><br>
                Use + ADD SUIT to create
                your first archive entry.
            `;

        suitListItems.appendChild(
            empty
        );

        return;
    }

    suits.forEach(
        (suit, index) => {

            const card =
                document.createElement("div");

            card.className =
                "suit-card";

            if (
                index === selectedSuit
            ) {

                card.classList.add(
                    "selected"
                );
            }

            const thumb =
                document.createElement("img");

            thumb.className =
                "suit-thumb";

            if (
                suit.images &&
                suit.images.length
            ) {

                thumb.src =
                    suit.images[0];

            } else {

                thumb.style.display =
                    "none";
            }

            const information =
                document.createElement("div");

            const name =
                document.createElement("div");

            name.className =
                "suit-card-name";

            name.textContent =
                suit.name;

            const meta =
                document.createElement("div");

            meta.className =
                "suit-card-meta";

            meta.textContent =
                `${suit.images?.length || 0} IMAGE(S)`;

            information.appendChild(
                name
            );

            information.appendChild(
                meta
            );

            card.appendChild(
                thumb
            );

            card.appendChild(
                information
            );

            card.addEventListener(
                "click",
                () => {

                    selectedSuit =
                        index;

                    selectedImageIndex =
                        0;

                    renderArchive();
                }
            );

            suitListItems.appendChild(
                card
            );
        }
    );
}


/* =========================================================
   SELECTED SUIT
========================================================= */

function renderSelectedSuit() {

    if (
        selectedSuit < 0 ||
        !suits[selectedSuit]
    ) {

        imagePlaceholder.style.display =
            "block";

        selectedImage.style.display =
            "none";

        detailName.textContent =
            "NO SUIT SELECTED";

        detailDescription.textContent =
            "Add a suit to begin building the archive.";

        detailImageCount.textContent =
            "0";

        return;
    }

    const suit =
        suits[selectedSuit];

    detailName.textContent =
        suit.name;

    detailDescription.textContent =
        suit.description ||
        generateDescription(
            suit.name
        );

    const images =
        suit.images || [];

    detailImageCount.textContent =
        String(
            images.length
        );

    if (
        images.length === 0
    ) {

        imagePlaceholder.style.display =
            "block";

        imagePlaceholder.textContent =
            "NO IMAGE ATTACHED";

        selectedImage.style.display =
            "none";

        return;
    }

    if (
        selectedImageIndex >= images.length
    ) {

        selectedImageIndex =
            images.length - 1;
    }

    imagePlaceholder.style.display =
        "none";

    selectedImage.style.display =
        "block";

    selectedImage.src =
        images[selectedImageIndex];
}


/* =========================================================
   IMAGE NAVIGATION
========================================================= */

previousImage.addEventListener(
    "click",
    () => {

        if (
            selectedSuit < 0
        )
            return;

        const images =
            suits[selectedSuit].images || [];

        if (
            images.length < 2
        )
            return;

        selectedImageIndex =
            (
                selectedImageIndex -
                1 +
                images.length
            ) %
            images.length;

        renderSelectedSuit();
    }
);


nextImage.addEventListener(
    "click",
    () => {

        if (
            selectedSuit < 0
        )
            return;

        const images =
            suits[selectedSuit].images || [];

        if (
            images.length < 2
        )
            return;

        selectedImageIndex =
            (
                selectedImageIndex +
                1
            ) %
            images.length;

        renderSelectedSuit();
    }
);


/* =========================================================
   SPEECH SYNTHESIS
========================================================= */

function speakText(
    text
) {

    if (
        !speechEnabled ||
        !("speechSynthesis" in window)
    ) {

        return;
    }

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.rate =
        .95;

    utterance.pitch =
        .95;

    utterance.volume =
        1;

    const voices =
        speechSynthesis.getVoices();

    const preferred =
        voices.find(
            voice =>
                /en-GB/i.test(
                    voice.lang
                )
        );

    if (preferred) {

        utterance.voice =
            preferred;
    }

    status.textContent =
        "SPEAKING";

    utterance.onend =
        () => {

            status.textContent =
                "STANDBY";
        };

    speechSynthesis.speak(
        utterance
    );
}


/* =========================================================
   SPEAK BUTTON
========================================================= */

speakButton.addEventListener(
    "click",
    () => {

        const last =
            chat.querySelector(
                ".chat-alex:last-child"
            );

        if (!last) {

            speakText(
                "A.L.E.X online."
            );

            return;
        }

        speakText(
            last.textContent
        );
    }
);


/* =========================================================
   MICROPHONE
========================================================= */

function setupMicrophone() {

    const SpeechRecognition =
        window.SpeechRecognition ||
        window.webkitSpeechRecognition;

    if (!SpeechRecognition) {

        recognition = null;

        return;
    }

    recognition =
        new SpeechRecognition();

    recognition.lang =
        "en-GB";

    recognition.continuous =
        false;

    recognition.interimResults =
        false;

    recognition.maxAlternatives =
        1;

    recognition.onstart =
        () => {

            micActive = true;

            micButton.textContent =
                "MIC ON";

            micButton.classList.add(
                "mic-active"
            );

            status.textContent =
                "LISTENING";
        };

    recognition.onresult =
        event => {

            const transcript =
                event.results[0][0].transcript;

            textInput.value =
                transcript;

            addChat(
                "USER",
                transcript
            );

            status.textContent =
                "THINKING";

            const answer =
                alexResponse(
                    transcript
                );

            setTimeout(
                () => {

                    addChat(
                        "ALEX",
                        answer
                    );

                    speakText(
                        answer
                    );

                    status.textContent =
                        "STANDBY";

                },
                250
            );
        };

    recognition.onerror =
        event => {

            console.log(
                "Speech recognition:",
                event.error
            );

            showToast(
                "Microphone error: " +
                event.error
            );
        };

    recognition.onend =
        () => {

            micActive = false;

            micButton.textContent =
                "MIC OFF";

            micButton.classList.remove(
                "mic-active"
            );

            if (
                status.textContent ===
                "LISTENING"
            ) {

                status.textContent =
                    "STANDBY";
            }
        };
}


function toggleMicrophone() {

    if (!recognition) {

        showToast(
            "Speech recognition is not supported in this browser."
        );

        return;
    }

    if (micActive) {

        recognition.stop();

    } else {

        try {

            recognition.start();

        } catch (error) {

            console.log(error);
        }
    }
}

micButton.addEventListener(
    "click",
    toggleMicrophone
);


/* =========================================================
   KEYBOARD MIC
   M = TOGGLE MIC
========================================================= */

document.addEventListener(
    "keydown",
    event => {

        if (
            event.key.toLowerCase() === "m" &&
            document.activeElement !== textInput &&
            !addModal.classList.contains(
                "visible"
            )
        ) {

            toggleMicrophone();
        }

        if (
            event.key === "Escape" &&
            addModal.classList.contains(
                "visible"
            )
        ) {

            closeAddModal();
        }

        if (
            event.key === "Escape" &&
            archive.classList.contains(
                "visible"
            ) &&
            !addModal.classList.contains(
                "visible"
            )
        ) {

            closeArchive();
        }
    }
);


/* =========================================================
   WAVEFORM
========================================================= */

const canvas =
    document.getElementById(
        "wave"
    );

const ctx =
    canvas.getContext(
        "2d"
    );

let phase = 0;

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );
}


function drawWave() {

    const rect =
        canvas.getBoundingClientRect();

    const width =
        rect.width;

    const height =
        rect.height;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    const center =
        height / 2;

    const bars =
        61;

    for (
        let i = 0;
        i < bars;
        i++
    ) {

        const x =
            width / 2 -
            width * .43 +
            i *
            (
                width * .86 /
                (bars - 1)
            );

        const distance =
            Math.abs(
                i -
                (bars - 1) / 2
            );

        const envelope =
            Math.max(
                0,
                1 -
                distance /
                ((bars - 1) / 2)
            );

        const movement =
            Math.abs(
                Math.sin(
                    phase +
                    i * .29
                )
            );

        const heightValue =
            5 +
            movement *
            42 *
            envelope;

        ctx.beginPath();

        ctx.moveTo(
            x,
            center -
            heightValue
        );

        ctx.lineTo(
            x,
            center +
            heightValue
        );

        ctx.lineWidth =
            2.5;

        ctx.strokeStyle =
            "rgba(57,255,20,.85)";

        ctx.shadowColor =
            "rgba(57,255,20,.45)";

        ctx.shadowBlur =
            8;

        ctx.stroke();
    }

    ctx.shadowBlur = 0;

    phase += .055;

    requestAnimationFrame(
        drawWave
    );
}


/* =========================================================
   RESIZE
========================================================= */

window.addEventListener(
    "resize",
    resizeCanvas
);


/* =========================================================
   START
========================================================= */

loadArchive();

setupMicrophone();

resizeCanvas();

drawWave();

addChat(
    "ALEX",
    "A.L.E.X online. Archive systems ready."
);

</script>
