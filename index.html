<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">

<meta name="theme-color" content="#020604">

<title>A.L.E.X</title>

<style>
    * {
        box-sizing: border-box;
        -webkit-tap-highlight-color: transparent;
    }

    html,
    body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #020604;
        color: #39ff14;
        font-family: "Courier New", monospace;
    }

    body {
        display: flex;
        justify-content: center;
        align-items: center;
    }

    /* =====================================================
       MAIN PORTRAIT INTERFACE
       ===================================================== */

    #app {
        position: relative;
        width: 100%;
        max-width: 520px;
        height: 100dvh;
        min-height: 620px;
        overflow: hidden;
        background:
            radial-gradient(
                circle at 50% 35%,
                rgba(0, 255, 100, 0.055),
                transparent 35%
            ),
            #020604;
    }

    /* subtle scanlines */

    #app::after {
        content: "";
        position: absolute;
        inset: 0;
        pointer-events: none;
        background:
            repeating-linear-gradient(
                to bottom,
                rgba(255,255,255,0.012) 0px,
                rgba(255,255,255,0.012) 1px,
                transparent 1px,
                transparent 4px
            );
        opacity: .35;
        z-index: 20;
    }

    /* =====================================================
       HEADER
       ===================================================== */

    #header {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 82px;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 18px;

        border-bottom: 1px solid rgba(57,255,20,.16);
        background: rgba(2,6,4,.78);

        z-index: 10;
    }

    #logo {
        display: flex;
        flex-direction: column;
        gap: 2px;
    }

    #logo-main {
        font-size: 24px;
        font-weight: bold;
        letter-spacing: 4px;
        text-shadow:
            0 0 5px #39ff14,
            0 0 14px rgba(57,255,20,.55);
    }

    #logo-sub {
        font-size: 8px;
        letter-spacing: 2px;
        color: #0f8c28;
    }

    /* =====================================================
       ARCHIVES
       ===================================================== */

    #archiveButton {
        border: 1px solid #39ff14;
        background: rgba(57,255,20,.035);
        color: #39ff14;

        font-family: inherit;
        font-size: 10px;
        letter-spacing: 1.5px;

        padding: 10px 13px;

        cursor: pointer;

        box-shadow:
            inset 0 0 12px rgba(57,255,20,.025),
            0 0 8px rgba(57,255,20,.12);

        transition: .15s;
    }

    #archiveButton:active {
        transform: scale(.96);
        background: rgba(57,255,20,.12);
    }

    /* =====================================================
       CENTRAL CORE
       ===================================================== */

    #coreArea {
        position: absolute;

        top: 92px;
        left: 0;
        width: 100%;

        height: 350px;

        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
    }

    #core {
        position: relative;

        width: 145px;
        height: 145px;

        display: flex;
        align-items: center;
        justify-content: center;
    }

    #core-ring-1,
    #core-ring-2,
    #core-ring-3 {
        position: absolute;
        border-radius: 50%;
        pointer-events: none;
    }

    #core-ring-1 {
        inset: 12px;
        border: 1px solid rgba(57,255,20,.75);
        box-shadow:
            0 0 15px rgba(57,255,20,.35);
        animation: rotate 12s linear infinite;
    }

    #core-ring-2 {
        inset: 27px;
        border: 1px dashed rgba(25,217,255,.65);
        animation: rotateReverse 8s linear infinite;
    }

    #core-ring-3 {
        inset: 42px;
        border: 1px solid rgba(57,255,20,.45);
        box-shadow:
            inset 0 0 18px rgba(57,255,20,.2);
        animation: pulse 2s ease-in-out infinite;
    }

    #core-dot {
        width: 20px;
        height: 20px;
        border-radius: 50%;

        background: #39ff14;

        box-shadow:
            0 0 8px #39ff14,
            0 0 22px #39ff14,
            0 0 45px rgba(57,255,20,.5);

        animation: corePulse 1.5s ease-in-out infinite;
    }

    @keyframes rotate {
        from {
            transform: rotate(0deg);
        }
        to {
            transform: rotate(360deg);
        }
    }

    @keyframes rotateReverse {
        from {
            transform: rotate(360deg);
        }
        to {
            transform: rotate(0deg);
        }
    }

    @keyframes pulse {
        0%,100% {
            opacity: .35;
        }
        50% {
            opacity: 1;
        }
    }

    @keyframes corePulse {
        0%,100% {
            transform: scale(.8);
        }
        50% {
            transform: scale(1.15);
        }
    }

    /* =====================================================
       WAVEFORM
       ===================================================== */

    #waveCanvas {
        position: absolute;

        left: 8%;
        width: 84%;

        bottom: 20px;
        height: 105px;

        opacity: .9;
    }

    /* =====================================================
       STATUS
       ===================================================== */

    #status {
        position: absolute;

        top: 425px;
        left: 0;
        width: 100%;

        text-align: center;

        font-size: 10px;
        letter-spacing: 2px;

        color: #39ff14;

        text-shadow:
            0 0 8px rgba(57,255,20,.45);
    }

    #statusDetail {
        margin-top: 7px;

        font-size: 8px;
        letter-spacing: 1px;

        color: #0f8c28;
    }

    /* =====================================================
       CHAT
       ===================================================== */

    #chat {
        position: absolute;

        left: 6%;
        width: 88%;

        top: 470px;
        bottom: 145px;

        border: 1px solid rgba(57,255,20,.18);

        background: rgba(0,8,4,.55);

        overflow-y: auto;

        padding: 12px;

        font-size: 11px;
        line-height: 1.55;

        scrollbar-width: thin;
        scrollbar-color: #145c19 transparent;
    }

    .message {
        margin-bottom: 15px;
        white-space: pre-wrap;
        word-break: break-word;
    }

    .message-user {
        color: #19d9ff;
    }

    .message-alex {
        color: #39ff14;
    }

    .message-label {
        display: block;

        margin-bottom: 3px;

        font-size: 8px;
        letter-spacing: 1px;

        opacity: .55;
    }

    /* =====================================================
       INPUT
       ===================================================== */

    #controls {
        position: absolute;

        left: 6%;
        width: 88%;

        bottom: 18px;
        height: 112px;

        display: flex;
        flex-direction: column;
        gap: 9px;

        z-index: 10;
    }

    #inputRow {
        display: flex;
        width: 100%;
        height: 46px;
    }

    #input {
        flex: 1;

        min-width: 0;

        border: 1px solid #176b20;
        border-right: none;

        outline: none;

        background: #030a05;
        color: #39ff14;

        padding: 0 12px;

        font-family: inherit;
        font-size: 11px;

        box-shadow:
            inset 0 0 15px rgba(57,255,20,.025);
    }

    #input::placeholder {
        color: #28652e;
    }

    #send {
        width: 65px;

        border: 1px solid #39ff14;

        background: rgba(57,255,20,.04);
        color: #39ff14;

        font-family: inherit;
        font-size: 9px;
        letter-spacing: 1px;

        cursor: pointer;
    }

    #buttonRow {
        display: flex;
        gap: 9px;
        height: 48px;
    }

    .controlButton {
        flex: 1;

        border: 1px solid #176b20;

        background: rgba(57,255,20,.025);
        color: #39ff14;

        font-family: inherit;
        font-size: 9px;
        letter-spacing: 1.5px;

        cursor: pointer;

        transition: .15s;
    }

    .controlButton:active,
    #send:active {
        background: rgba(57,255,20,.12);
        transform: scale(.98);
    }

    #speak {
        border-color: #19d9ff;
        color: #19d9ff;
    }

    /* =====================================================
       ARCHIVE SCREEN
       ===================================================== */

    #archives {
        position: absolute;
        inset: 0;

        background: #020604;

        z-index: 30;

        display: none;

        flex-direction: column;
    }

    #archiveHeader {
        height: 82px;

        flex-shrink: 0;

        display: flex;
        align-items: center;
        justify-content: space-between;

        padding: 0 18px;

        border-bottom: 1px solid rgba(57,255,20,.16);
    }

    #archiveTitle {
        font-size: 15px;
        letter-spacing: 3px;
    }

    #closeArchive {
        border: 1px solid #39ff14;
        background: transparent;
        color: #39ff14;

        font-family: inherit;
        padding: 9px 12px;
        font-size: 9px;
    }

    #archiveList {
        flex: 1;

        overflow-y: auto;

        padding: 18px;
    }

    .archiveCard {
        border: 1px solid #145c19;

        padding: 16px;
        margin-bottom: 12px;

        background: rgba(57,255,20,.025);

        cursor: pointer;
    }

    .archiveCard:active {
        background: rgba(57,255,20,.08);
    }

    .archiveName {
        color: #39ff14;
        font-size: 12px;
        letter-spacing: 1px;
    }

    .archiveInfo {
        margin-top: 7px;

        color: #3a8f45;

        font-size: 9px;
        line-height: 1.5;
    }

    /* =====================================================
       RESPONSIVE PORTRAIT
       ===================================================== */

    @media (max-height: 700px) {

        #coreArea {
            top: 80px;
            height: 280px;
        }

        #core {
            transform: scale(.82);
        }

        #status {
            top: 345px;
        }

        #chat {
            top: 385px;
            bottom: 140px;
        }
    }

    @media (min-height: 850px) {

        #coreArea {
            height: 390px;
        }

        #status {
            top: 455px;
        }

        #chat {
            top: 505px;
        }
    }

</style>
</head>

<body>

<div id="app">

    <!-- HEADER -->

    <header id="header">

        <div id="logo">

            <div id="logo-main">
                A.L.E.X
            </div>

            <div id="logo-sub">
                PERSONAL SYSTEM
            </div>

        </div>

        <button id="archiveButton">
            ARCHIVES
        </button>

    </header>


    <!-- CORE -->

    <section id="coreArea">

        <div id="core">

            <div id="core-ring-1"></div>
            <div id="core-ring-2"></div>
            <div id="core-ring-3"></div>

            <div id="core-dot"></div>

        </div>

        <canvas id="waveCanvas"></canvas>

    </section>


    <!-- STATUS -->

    <div id="status">

        A.L.E.X // <span id="statusText">STANDBY</span>

        <div id="statusDetail">
            SYSTEM ONLINE
        </div>

    </div>


    <!-- CHAT -->

    <main id="chat">

        <div class="message message-alex">

            <span class="message-label">
                A.L.E.X // SYSTEM
            </span>

            System online.
            Ready for your command.

        </div>

    </main>


    <!-- CONTROLS -->

    <section id="controls">

        <div id="inputRow">

            <input
                id="input"
                type="text"
                autocomplete="off"
                placeholder="Ask A.L.E.X..."
            >

            <button id="send">
                SEND
            </button>

        </div>

        <div id="buttonRow">

            <button
                class="controlButton"
                id="speak">
                SPEAK
            </button>

            <button
                class="controlButton"
                id="clear">
                CLEAR
            </button>

        </div>

    </section>


    <!-- ARCHIVES -->

    <section id="archives">

        <div id="archiveHeader">

            <div id="archiveTitle">
                A.L.E.X // ARCHIVES
            </div>

            <button id="closeArchive">
                CLOSE
            </button>

        </div>

        <div id="archiveList">

            <div class="archiveCard">

                <div class="archiveName">
                    SPIDER-MAN
                </div>

                <div class="archiveInfo">
                    Suit archive module
                </div>

            </div>

            <div class="archiveCard">

                <div class="archiveName">
                    IRON SPIDER
                </div>

                <div class="archiveInfo">
                    Advanced suit archive
                </div>

            </div>

            <div class="archiveCard">

                <div class="archiveName">
                    INTEGRATED SUIT
                </div>

                <div class="archiveInfo">
                    Integrated technology archive
                </div>

            </div>

            <div class="archiveCard">

                <div class="archiveName">
                    STEALTH SUIT
                </div>

                <div class="archiveInfo">
                    Stealth configuration archive
                </div>

            </div>

        </div>

    </section>

</div>


<script>

/* =========================================================
   A.L.E.X CONFIGURATION
   ========================================================= */

const CONFIG = {

    /*
       If Ollama is running on the SAME computer:

       http://127.0.0.1:11434/api/chat

       If the webpage is on your phone and Ollama is
       running on your PC, replace this with your PC's
       LAN address, for example:

       http://192.168.1.100:11434/api/chat
    */

    OLLAMA_URL:
        "http://127.0.0.1:11434/api/chat",

    MODEL:
        "qwen3:14b"

};


/* =========================================================
   ELEMENTS
   ========================================================= */

const input =
    document.getElementById("input");

const send =
    document.getElementById("send");

const speak =
    document.getElementById("speak");

const clearButton =
    document.getElementById("clear");

const chat =
    document.getElementById("chat");

const statusText =
    document.getElementById("statusText");

const statusDetail =
    document.getElementById("statusDetail");

const archiveButton =
    document.getElementById("archiveButton");

const archives =
    document.getElementById("archives");

const closeArchive =
    document.getElementById("closeArchive");


/* =========================================================
   CHAT
   ========================================================= */

function addMessage(
    speaker,
    text
) {

    const message =
        document.createElement("div");

    message.className =
        "message " +
        (
            speaker === "USER"
                ? "message-user"
                : "message-alex"
        );

    const label =
        document.createElement("span");

    label.className =
        "message-label";

    label.textContent =
        speaker === "USER"
            ? "USER"
            : "A.L.E.X";

    message.appendChild(label);

    message.appendChild(
        document.createTextNode(text)
    );

    chat.appendChild(message);

    chat.scrollTop =
        chat.scrollHeight;
}


/* =========================================================
   STATUS
   ========================================================= */

function setStatus(
    status,
    detail
) {

    statusText.textContent =
        status;

    statusDetail.textContent =
        detail || "";
}


/* =========================================================
   OLLAMA
   ========================================================= */

async function askAlex(
    text
) {

    setStatus(
        "THINKING",
        "PROCESSING REQUEST"
    );

    try {

        const response =
            await fetch(
                CONFIG.OLLAMA_URL,
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body: JSON.stringify({

                        model:
                            CONFIG.MODEL,

                        messages: [

                            {
                                role: "system",

                                content:
                                    "You are A.L.E.X, a highly capable personal AI assistant. Be intelligent, natural, concise and helpful. Do not use emojis."
                            },

                            {
                                role: "user",

                                content:
                                    text
                            }

                        ],

                        stream: false,

                        think: false,

                        keep_alive:
                            "10m",

                        options: {

                            temperature:
                                0.7,

                            num_ctx:
                                4096

                        }

                    })
                }
            );

        if (!response.ok) {

            throw new Error(
                "Ollama returned HTTP " +
                response.status
            );

        }

        const data =
            await response.json();

        const answer =
            data.message &&
            data.message.content
                ? data.message.content.trim()
                : "";

        if (!answer) {

            throw new Error(
                "A.L.E.X returned no response."
            );

        }

        addMessage(
            "ALEX",
            answer
        );

        setStatus(
            "STANDBY",
            "SYSTEM ONLINE"
        );

        speakText(
            answer
        );

    }
    catch (error) {

        console.error(error);

        addMessage(
            "ALEX",
            "Ollama connection error:\n" +
            error.message
        );

        setStatus(
            "ERROR",
            "CHECK OLLAMA CONNECTION"
        );

    }

}


/* =========================================================
   SEND
   ========================================================= */

async function sendMessage() {

    const text =
        input.value.trim();

    if (!text)
        return;

    input.value = "";

    addMessage(
        "USER",
        text
    );

    await askAlex(
        text
    );

}


/* =========================================================
   ENTER
   ========================================================= */

input.addEventListener(
    "keydown",
    event => {

        if (
            event.key === "Enter"
            && !event.shiftKey
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);


send.addEventListener(
    "click",
    sendMessage
);


/* =========================================================
   CLEAR
   ========================================================= */

clearButton.addEventListener(
    "click",
    () => {

        chat.innerHTML = "";

        addMessage(
            "ALEX",
            "Conversation cleared."
        );

    }
);


/* =========================================================
   SPEECH
   ========================================================= */

function speakText(
    text
) {

    if (
        !("speechSynthesis" in window)
    )
        return;

    window.speechSynthesis.cancel();

    const utterance =
        new SpeechSynthesisUtterance(
            text
        );

    utterance.rate =
        0.95;

    utterance.pitch =
        1.0;

    utterance.volume =
        1.0;

    const voices =
        speechSynthesis.getVoices();

    const englishVoice =
        voices.find(
            voice =>
                voice.lang &&
                voice.lang
                    .toLowerCase()
                    .startsWith("en")
        );

    if (englishVoice) {

        utterance.voice =
            englishVoice;

    }

    setStatus(
        "SPEAKING",
        "AUDIO OUTPUT ACTIVE"
    );

    utterance.onend =
        () => {

            setStatus(
                "STANDBY",
                "SYSTEM ONLINE"
            );

        };

    speechSynthesis.speak(
        utterance
    );

}


/* =========================================================
   SPEAK BUTTON
   ========================================================= */

speak.addEventListener(
    "click",
    () => {

        if (
            speechSynthesis.speaking
        ) {

            speechSynthesis.cancel();

            setStatus(
                "STANDBY",
                "SYSTEM ONLINE"
            );

            return;

        }

        speakText(
            "A.L.E.X voice system online."
        );

    }
);


/* =========================================================
   ARCHIVES
   ========================================================= */

archiveButton.addEventListener(
    "click",
    () => {

        archives.style.display =
            "flex";

    }
);


closeArchive.addEventListener(
    "click",
    () => {

        archives.style.display =
            "none";

    }
);


/* =========================================================
   WAVEFORM
   ========================================================= */

const canvas =
    document.getElementById(
        "waveCanvas"
    );

const ctx =
    canvas.getContext("2d");

let phase = 0;

function resizeCanvas() {

    const rect =
        canvas.getBoundingClientRect();

    const dpr =
        window.devicePixelRatio || 1;

    canvas.width =
        rect.width * dpr;

    canvas.height =
        rect.height * dpr;

    ctx.setTransform(
        dpr,
        0,
        0,
        dpr,
        0,
        0
    );

}


function drawWave() {

    const rect =
        canvas.getBoundingClientRect();

    const width =
        rect.width;

    const height =
        rect.height;

    ctx.clearRect(
        0,
        0,
        width,
        height
    );

    phase += 0.045;

    const center =
        height / 2;

    const bars =
        55;

    const gap =
        width / bars;

    for (
        let i = 0;
        i < bars;
        i++
    ) {

        const x =
            i * gap;

        const distance =
            Math.abs(
                i - bars / 2
            ) / (bars / 2);

        const envelope =
            1 - distance * .75;

        const wave =
            Math.abs(
                Math.sin(
                    i * .31 +
                    phase
                )
            );

        const secondary =
            Math.abs(
                Math.sin(
                    i * .13 -
                    phase * 1.4
                )
            );

        const amount =
            (
                wave * .65 +
                secondary * .35
            ) * envelope;

        const barHeight =
            8 + amount * 58;

        ctx.beginPath();

        ctx.moveTo(
            x,
            center - barHeight
        );

        ctx.lineTo(
            x,
            center + barHeight
        );

        ctx.lineWidth = 2;

        ctx.strokeStyle =
            i % 4 === 0
                ? "#19d9ff"
                : "#39ff14";

        ctx.shadowBlur =
            8;

        ctx.shadowColor =
            ctx.strokeStyle;

        ctx.stroke();

    }

    ctx.shadowBlur = 0;

    requestAnimationFrame(
        drawWave
    );

}


window.addEventListener(
    "resize",
    resizeCanvas
);

resizeCanvas();
drawWave();


/* =========================================================
   INITIALISE
   ========================================================= */

setStatus(
    "STANDBY",
    "SYSTEM ONLINE"
);

</script>

</body>
</html>
